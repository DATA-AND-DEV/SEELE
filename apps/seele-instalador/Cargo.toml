[package]
name = "seele-instalador"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "O instalador do SEELE para Windows. Ver ADR 0043."

# **Nenhuma dependência do produto, e isto é regra e não economia.**
#
# Está no `xtask/src/check_deps.rs` junto do `xtask`, pela mesma razão: se o
# instalador dependesse do `seele-core`, construir o instalador exigiria
# construir o produto — e uma mudança no produto poderia quebrar a instalação de
# todo mundo por um caminho que ninguém liga aos dois.
[dependencies]

# O ícone do `.exe` — ver `build.rs`. Já está na árvore pelo `tauri-build`, então
# não acrescenta nada ao grafo.
#
# **Sem `cfg(windows)`**, e isso não é descuido: um `build.rs` é compilado para a
# máquina que compila, não para o alvo. `[target.'cfg(windows)'.build-dependencies]`
# significa «quando quem compila é Windows» — e quem compila o instalador do
# Windows, aqui, é um Mac. Quem decide se o recurso entra é o próprio `build.rs`,
# olhando `CARGO_CFG_TARGET_OS`.
[build-dependencies]
embed-resource = "3"
# O `build.rs` comprime a carga: ver `carga()` lá.
brotli = "8"

[target.'cfg(windows)'.dependencies]
# A carga é um `.tar` comprimido com brotli, e os dois já estão na árvore.
#
# **Brotli e não gzip, e a diferença é medida em megabytes.** Com gzip o
# instalador saiu 4,3 MB maior que o do NSIS, que usa LZMA — e este `.exe` é
# baixado de novo a cada atualização, por todo mundo. O brotli comprime na faixa
# do LZMA e já vem pelo Tauri; trocar custa uma linha de cada lado.
#
# Sólido e não por arquivo: o produto são dezenas de arquivos parecidos, e
# comprimir o `.tar` inteiro aproveita a semelhança entre eles, enquanto um
# `.zip` comprimiria cada um sozinho.
brotli = "8"
tar = "0.4"

# A mesma versão que o `seele-video` já traz, para o `Cargo.lock` não carregar
# duas cópias do mundo do Windows.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Com_Urlmon",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
] }

# **Folha própria, e a razão é uma linha só.**
#
# `unsafe_code` precisa ser `deny` em vez de `forbid` — a janela é Win32, e todo
# Win32 é `unsafe`. `forbid` não se afrouxa nem com `allow` dentro de um módulo,
# que é o mecanismo com que o `seele-video` isola a mesma necessidade (ADR 0041).
#
# Todo o resto é **cópia** do `[workspace.lints]`, e cópia apodrece: uma regra
# acrescentada ao workspace amanhã não chega aqui sozinha. Quem prende isso é
# `xtask/tests/folha_de_lints.rs`, que lê os dois arquivos e reprova qualquer
# divergência que não seja esta.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"
