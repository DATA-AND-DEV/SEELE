[package]
name = "seele-app"
description = "The desktop client. A Tauri shell over seele-ffi. specs/06-clientes-gui.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# ADR 0002 and specs/06: the desktop shell sees `seele-ffi`, which sees
# `seele-core`. Nothing here may reach past it — a Tauri command that names an
# `ssrc` is protocol knowledge in the shell.
[dependencies]
seele-ffi = { path = "../../crates/seele-ffi" }
# Exceção nomeada no `cargo xtask check-deps`, mesmo motivo do `seele-tui`: o
# botão **Hospedar** põe o servidor dentro do app. Aresta lateral no topo do
# grafo, não inversão — este binário contém os dois papéis.
seele-server = { path = "../../crates/seele-server" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Só para os guardas de `tests/frontend.rs`: o frontend ramifica no *texto* que
# um `Event` vira na ponte, e comparar com o texto de verdade é a única forma de
# uma variante renomeada quebrar a compilação em vez de virar um ramo morto.
# Mesma versão que o `seele-server` já traz para a árvore.
[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true

[[bin]]
name = "seele-app"
path = "src/main.rs"
