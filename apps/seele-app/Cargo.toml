[package]
name = "seele-app"
description = "The desktop client. A Tauri shell over seele-ffi. specs/06-clientes-gui.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# ADR 0002 and specs/06: the desktop shell sees `seele-ffi`, which sees
# `seele-core`. Nothing here may reach past it — a Tauri command that names an
# `ssrc` is protocol knowledge in the shell.
[dependencies]
seele-ffi = { path = "../../crates/seele-ffi" }
# Exceção nomeada no `cargo xtask check-deps`, mesmo motivo do `seele-tui`: o
# botão **Hospedar** põe o servidor dentro do app. Aresta lateral no topo do
# grafo, não inversão — este binário contém os dois papéis.
seele-server = { path = "../../crates/seele-server" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# Não é escolha de arquitetura: `tauri::generate_context!` gera código que
# nomeia `serde_json` sempre que o `tauri.conf.json` tem um bloco `plugins`, e
# passou a ter quando o atualizador entrou. Era dependência só de teste — os
# guardas de `tests/frontend.rs` continuam usando esta mesma.
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
# O seletor de arquivos. Emenda do ADR 0027, que tinha fechado dizendo que
# nenhuma dependência nova entraria por causa de anexos — e o primeiro dono a
# usar o app clicou no botão ARQUIVO esperando um seletor.
#
# Três crates, contados nos três alvos com `cargo tree --no-dedupe`: este,
# `tauri-plugin-fs` (de onde vem o tipo `FilePath`) e `rfd`. Nada além disso, em
# nenhum dos três: o `rfd` fala com a API do sistema em cada um deles, e as três
# APIs já estavam na árvore por causa do próprio Tauri.
tauri-plugin-dialog = "2.7"
# Atualização pelo próprio app. ADR 0026.
#
# Fixado no minor porque o plugin expõe o `reqwest` dele na API pública
# (`configure_client`) e o próprio README avisa que a versão do reqwest muda em
# lançamentos menores. `rustls-tls` é o padrão e é o que queremos: a alternativa
# arrastaria OpenSSL para uma árvore que o `deny.toml` já diz que não o quer.
tauri-plugin-updater = { version = "2.10", default-features = false, features = [
    "rustls-tls",
    "zip",
] }
# Para buscar o módulo do OpenH264, uma vez, quando a pessoa pede.
#
# **A versão é a do `tauri-plugin-updater` acima, e isso não é coincidência**:
# declarar `0.12` resolvia e punha uma segunda cópia do `reqwest` na árvore, com
# a sua própria pilha de TLS junto. O `deny.toml` avisa sobre versões múltiplas e
# eu não teria notado sem olhar o `Cargo.lock` — daí este comentário, para quem
# for atualizar: se o plugin pular de minor, este número pula junto.
#
# O nome da feature também mudou entre as duas: aqui é `rustls`, não
# `rustls-tls`. Nada de OpenSSL nos dois casos, que é o que o `deny.toml` quer.
# `rustls-no-provider` e não `rustls`: o segundo escolhe o `aws-lc-rs`, que
# compila C e assembly, e a árvore já tem o `ring` — que é o que o próprio
# atualizador usa. Ligar o outro poria duas pilhas de criptografia no binário e
# um toolchain de C na conta de quem compila para Windows.
#
# O preço de «no-provider» é que alguém precisa dizer qual é: `main` instala o
# `ring` como padrão do processo, e o comentário lá explica por que ali.
#
# Sem `system-proxy`, e a razão é paridade e não economia: quatro crates, e o
# atualizador — que baixa desta mesma máquina, pela mesma rede — não o liga. Se
# um proxy corporativo impede um, impede o outro, e o conserto é dos dois juntos.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
] }
# Só para nomear o provedor de criptografia acima. Zero na árvore: o
# `tauri-plugin-updater` já o traz, nesta versão.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[dev-dependencies]
# `test` traz o runtime falso, e nada mais: a lista de features do `tauri` diz
# `test = []`. É o que deixa `tests/permissoes.rs` construir o app de verdade —
# com este `tauri.conf.json` e com a ACL gerada dele — e fazer a mesma chamada
# de IPC que o frontend faz, sem servidor gráfico nenhum.
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[[bin]]
name = "seele-app"
path = "src/main.rs"
