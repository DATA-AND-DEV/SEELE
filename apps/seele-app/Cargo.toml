[package]
name = "seele-app"
description = "The desktop client. A Tauri shell over seele-ffi. specs/06-clientes-gui.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# ADR 0002 and specs/06: the desktop shell sees `seele-ffi`, which sees
# `seele-core`. Nothing here may reach past it — a Tauri command that names an
# `ssrc` is protocol knowledge in the shell.
[dependencies]
seele-ffi = { path = "../../crates/seele-ffi" }
# Exceção nomeada no `cargo xtask check-deps`, mesmo motivo do `seele-tui`: o
# botão **Hospedar** põe o servidor dentro do app. Aresta lateral no topo do
# grafo, não inversão — este binário contém os dois papéis.
seele-server = { path = "../../crates/seele-server" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# Não é escolha de arquitetura: `tauri::generate_context!` gera código que
# nomeia `serde_json` sempre que o `tauri.conf.json` tem um bloco `plugins`, e
# passou a ter quando o atualizador entrou. Era dependência só de teste — os
# guardas de `tests/frontend.rs` continuam usando esta mesma.
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
# Atualização pelo próprio app. ADR 0026.
#
# Fixado no minor porque o plugin expõe o `reqwest` dele na API pública
# (`configure_client`) e o próprio README avisa que a versão do reqwest muda em
# lançamentos menores. `rustls-tls` é o padrão e é o que queremos: a alternativa
# arrastaria OpenSSL para uma árvore que o `deny.toml` já diz que não o quer.
tauri-plugin-updater = { version = "2.10", default-features = false, features = [
    "rustls-tls",
    "zip",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[[bin]]
name = "seele-app"
path = "src/main.rs"
