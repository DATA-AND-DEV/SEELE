<!-- SEELE · símbolo. Dois nós e uma ligação: o cheio é quem hospeda, o vazio é
     quem chega, a diagonal é o enlace. Numa grade de 96, traço e respiro em
     múltiplos de 4. O nó vazio é 20 com traço de 4 — extensão externa de 24,
     igual à do cheio: as massas são iguais de propósito. Ver docs/marca.md.
     NÃO editar à mão: é a fonte de todos os tamanhos. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="SEELE">
  <title>SEELE</title>
  <path d="M34 34L62 62" stroke="#EAE3CF" stroke-width="4"/>
  <rect x="12" y="12" width="24" height="24" fill="#F2521F"/>
  <rect x="62" y="62" width="20" height="20" fill="none" stroke="#F2521F" stroke-width="4"/>
</svg>
