<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEELE — teste de conexão</title>
<link rel="stylesheet" href="fontes.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="diagnostico-rede.css">
<main>
  <header class="diag-marca">
    <img src="marca-simbolo.svg" alt="" width="24" height="24">
    <p class="diag-marca-rotulo">SEELE · CONEXÃO</p>
  </header>
  <h1>Testar a conexão com um servidor</h1>
  <div class="diag-campo">
    <label for="convite">Convite do servidor</label>
    <textarea id="convite" rows="1" autocomplete="off" spellcheck="false" aria-describedby="convite-dica"></textarea>
    <p id="convite-dica" class="diag-dica">Cole o convite HTTPS do SEELE.</p>
  </div>
  <div class="diag-acoes">
    <button id="testar" class="diag-primario">Testar conexão</button>
    <button id="parar" disabled>Cancelar</button>
    <p id="estado" role="status">Não usa microfone, câmera nem lê conversas.</p>
  </div>
  <ul id="etapas" class="diag-etapas" aria-label="Etapas do teste" hidden></ul>
  <details class="diag-bruto"><summary>resultado completo</summary><pre id="resultado"></pre></details>
  <div class="diag-acoes">
    <button id="copiar" disabled>Copiar diagnóstico</button>
    <a id="entrar" class="diag-primario" hidden>Entrar no servidor</a>
  </div>
</main>

<script src="rtc-web.js"></script>
<script src="sessao-web.js"></script>
<script src="diagnostico-rede.js"></script>
</html>
