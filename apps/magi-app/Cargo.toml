[package]
name = "magi-app"
description = "The desktop client. A Tauri shell over magi-ffi. specs/06-clientes-gui.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# ADR 0002 and specs/06: the desktop shell sees `magi-ffi`, which sees
# `magi-core`. Nothing here may reach past it — a Tauri command that names an
# `ssrc` is protocol knowledge in the shell.
[dependencies]
magi-ffi = { path = "../../crates/magi-ffi" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[[bin]]
name = "magi-app"
path = "src/main.rs"
