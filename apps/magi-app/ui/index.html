<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>MAGI · Entry Plug</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="magi.css">
</head>
<body>

<!--
  A composição é a mesma do `plug` de propósito. `specs/06-clientes-gui.md`:
  "Alguém que usa a TUI deve abrir o app e saber onde tudo está sem procurar."
  Mesmo cabeçalho, mesmos três painéis na mesma ordem, mesma barra permanente
  no rodapé.
-->

<!-- Boot. Dura o tempo real da conexão; nada aqui espera de propósito. -->
<section id="tela-boot" class="tela">
  <div class="boot">
    <h1 class="boot-marca">MAGI</h1>
    <p class="boot-sub" lang="ja">同期率</p>

    <form id="form-conectar" class="boot-form" autocomplete="off">
      <label class="campo">
        <span class="rotulo">DOGMA</span>
        <input id="campo-servidor" name="servidor" value="127.0.0.1:8383"
               spellcheck="false" autocapitalize="off" required>
      </label>
      <label class="campo">
        <span class="rotulo">PILOTO</span>
        <input id="campo-apelido" name="apelido" value="piloto"
               spellcheck="false" autocapitalize="off" maxlength="32" required>
      </label>
      <label class="campo campo-linha">
        <input id="campo-audio" type="checkbox" checked>
        <span class="rotulo">inserir plug com áudio</span>
      </label>
      <button id="botao-conectar" type="submit" class="botao">INSERIR PLUG</button>
    </form>

    <ol class="subsistemas" aria-label="subsistemas">
      <li><span>MELCHIOR</span><b id="sub-melchior">·</b></li>
      <li><span>BALTHASAR</span><b id="sub-balthasar">·</b></li>
      <li><span>CASPER</span><b id="sub-casper">·</b></li>
    </ol>

    <p id="boot-erro" class="erro" role="alert" hidden></p>
  </div>
</section>

<!-- Operação. -->
<section id="tela-sessao" class="tela" hidden>
  <header class="topo">
    <span class="marca">MAGI</span>
    <span class="regua"></span>
    <span class="kanji" lang="ja">同期率</span>
    <span class="regua"></span>
    <span class="kanji" lang="ja">第3新東京市</span>
    <span class="regua"></span>
    <span id="padrao" class="padrao">PADRÃO: AZUL</span>
    <span class="regua regua-larga"></span>
    <time id="relogio" class="relogio">--:--:--</time>
  </header>

  <!--
    O banner é o único lugar que pode roubar a atenção. `specs/08-seguranca.md`
    quer o aviso de chave trocada impossível de ignorar; usar o mesmo tratamento
    para uma menção ensinaria a fechar sem ler.
  -->
  <div id="banner" class="banner" role="alert" hidden>
    <span class="kanji" lang="ja">警告</span>
    <span id="banner-texto"></span>
    <button id="banner-fechar" class="botao-fantasma" type="button">dispensar</button>
  </div>

  <main class="paineis">
    <section class="painel painel-dogma" aria-label="Dogma">
      <h2 class="painel-titulo">DOGMA</h2>
      <ul id="lista-dogma" class="lista"></ul>
    </section>

    <section class="painel painel-canais" aria-label="Cages e Linhas">
      <h2 class="painel-titulo">CAGES / LINHAS</h2>
      <ul id="lista-canais" class="lista lista-canais"></ul>
    </section>

    <section class="painel painel-mensagens" aria-label="Mensagens">
      <h2 class="painel-titulo">MENSAGENS</h2>
      <ol id="lista-mensagens" class="mensagens"></ol>
      <form id="form-mensagem" class="compor" autocomplete="off">
        <span class="prompt">▸</span>
        <input id="campo-mensagem" name="mensagem" placeholder="escrever…"
               maxlength="4000" autocomplete="off">
      </form>
    </section>
  </main>

  <!--
    Permanente, não escondida em menu. `specs/05-cliente-tui.md` chama isso de
    "a diferença de caráter em relação a um cliente de chat comum", e a versão
    gráfica não teria licença para escondê-la.
  -->
  <footer class="telemetria">
    <span class="metrica"><b class="rotulo">SYNC</b> <span id="tel-sync">·</span></span>
    <span class="metrica"><b class="rotulo">RTT</b> <span id="tel-rtt">·</span></span>
    <span class="metrica"><b class="rotulo">JIT</b> <span id="tel-jit">·</span></span>
    <span class="metrica"><b class="rotulo">LOSS</b> <span id="tel-loss">·</span></span>
    <span class="metrica"><b class="rotulo">OPUS</b> <span id="tel-opus">·</span></span>
    <span class="espaco"></span>
    <button id="botao-falar" class="botao-estado" type="button" title="segure para falar">
      FALAR
    </button>
    <button id="botao-voz" class="botao-estado" type="button"
            title="como o microfone abre">TECLA</button>
    <button id="botao-mudo" class="botao-estado" type="button">A.T. OFF</button>
    <button id="botao-surdo" class="botao-estado" type="button">OUVINDO</button>
    <span id="tel-local" class="falha-local" hidden title="a máquina, não a rede">
      ÁUDIO LOCAL FALHANDO
    </span>
  </footer>
</section>

<!-- Sessão encerrada. Diz por quê; um app que fecha calado vira suporte. -->
<section id="tela-fim" class="tela" hidden>
  <div class="boot">
    <h1 class="boot-marca fim">ENLACE ENCERRADO</h1>
    <p id="fim-motivo" class="fim-motivo"></p>
    <button id="botao-voltar" class="botao" type="button">EJETAR</button>
  </div>
</section>

<script src="magi.js"></script>
</body>
</html>
