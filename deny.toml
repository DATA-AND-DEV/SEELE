# specs/08-seguranca.md: "cargo deny and cargo audit in CI, failing the build on a
# known vulnerability."

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
# An entry here is a deliberate exception and needs a reason. Everything listed
# is `unmaintained` — **no vulnerability is ignored**, and the day one of these
# becomes a vulnerability it stops matching this list and fails the build.
#
# All of it arrives with Tauri, which specs/06-clientes-gui.md chose over
# Electron. ADR 0020 records the trade and what would make it stop being
# acceptable.
ignore = [
    # GTK3 bindings. Linux only, and reached only through webkit2gtk, which is
    # the system webview Tauri uses there. Upstream's migration to GTK4 is
    # tracked by Tauri, not by us; we do not call these crates directly.
    { id = "RUSTSEC-2024-0411", reason = "gtk3 bindings via tauri/webkit2gtk, Linux only" },
    { id = "RUSTSEC-2024-0412", reason = "gtk3 bindings via tauri/webkit2gtk, Linux only" },
    { id = "RUSTSEC-2024-0413", reason = "gtk3 bindings via tauri/webkit2gtk, Linux only" },
    { id = "RUSTSEC-2024-0414", reason = "gtk3 bindings via tauri/webkit2gtk, Linux only" },
    { id = "RUSTSEC-2024-0415", reason = "gtk3 bindings via tauri/webkit2gtk, Linux only" },
    { id = "RUSTSEC-2024-0416", reason = "gtk3 bindings via tauri/webkit2gtk, Linux only" },
    { id = "RUSTSEC-2024-0417", reason = "gtk3 bindings via tauri/webkit2gtk, Linux only" },
    { id = "RUSTSEC-2024-0418", reason = "gtk3 bindings via tauri/webkit2gtk, Linux only" },
    { id = "RUSTSEC-2024-0419", reason = "gtk3 bindings via tauri/webkit2gtk, Linux only" },
    { id = "RUSTSEC-2024-0420", reason = "gtk3 bindings via tauri/webkit2gtk, Linux only" },
    # Build-time only: a proc-macro helper in tauri's macro crate. Never linked
    # into a shipped binary.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, build-time only, via tauri-macros" },
    # Unicode tables behind tauri's URL/IDNA handling. Data crates with no
    # unsafe and no network surface of their own.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range, unicode tables via tauri" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common, unicode tables via tauri" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property, unicode tables via tauri" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version, unicode tables via tauri" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident, unicode tables via tauri" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Our own crates carry no `license` field yet: the rights posture around the
# Evangelion vocabulary is still open (specs/07-estetica.md), and inventing
# a licence before that decision would be worse than leaving it blank. They are
# all `publish = false`, so skip them rather than fail on them.
private = { ignore = true }
# Permissive, plus MPL-2.0 under the exception below. Anything stronger — GPL,
# AGPL, LGPL — stays denied by omission and must be discussed before it enters
# the tree: SEELE ships a single statically linked binary (ADR 0008), so linking
# terms actually matter here.
#
# MPL-2.0 is file-level copyleft: it reaches the files it covers and not the
# work that links them. The five crates that carry it here are Servo's CSS
# parser and friends, pulled in by Tauri, used unmodified. If we ever *modify*
# one, those files must be published — which is the whole obligation, and it is
# one we can meet. ADR 0020.
#
# MIT-0 is MIT with the attribution clause removed — strictly more permissive
# than MIT, which is already allowed. It arrived with `dcv-color-primitives`,
# the BGRA-to-I420 converter on the Windows capture path.
#
# bzip2-1.0.6 is the original bzip2 licence: BSD-style, four clauses, no
# advertising clause and no propagation term. It permits binary redistribution
# with the notice preserved, which is what a single statically linked binary
# (ADR 0008) needs. It arrived with `libbz2-rs-sys`, under `bzip2`, which
# `seele-video` uses to expand the OpenH264 module that the product downloads
# rather than ships — the same licence constraint that keeps the codec out of
# the installer is what puts a decompressor in the tree.
#
# It was rejected by omission and the supply-chain job had been red on it since
# it entered. Adding a licence to this list is a decision, not paperwork, so the
# reasoning above is the decision: permissive, no linking terms, notice-only.
allow = [
    "MPL-2.0",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace `path` dependencies have no version requirement by design.
# The ban is aimed at wildcard versions of third-party crates.
allow-wildcard-paths = true
# Nothing is banned outright yet. Expected future entries, once the real
# dependency tree exists: a second TLS stack next to rustls, and any crate that
# pulls OpenSSL into a project whose whole point is one self-contained binary.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
