[package]
name = "snapshot-no-wasm"
description = "Spike da Tarefa 2.2 da F4: o Room do seele-core em wasm32-unknown-unknown, e o custo de um retrato de sala cheia. DESCARTÁVEL."
version = "0.0.0"
edition = "2024"
publish = false

# Fora do workspace. Até `4e1139fc` o `build.rs` lia o `state.rs` e o
# `assento.rs` do `seele-core` pelo caminho e recortava o `SessionInfo` do
# `client.rs`; desde o corte (2.2, fase 1) o spike usa o `seele-sessao`, que é
# o mesmo texto num crate que compila no navegador.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
seele-proto = { path = "../../crates/seele-proto" }
seele-sessao = { path = "../../crates/seele-sessao" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
