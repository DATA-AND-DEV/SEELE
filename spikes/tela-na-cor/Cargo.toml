[package]
name = "spike-tela-na-cor"
description = "Prova de desenho: a dcv-color-primitives vale a troca no caminho BGRA→I420 do Windows? DESCARTÁVEL."
version = "0.0.0"
edition = "2021"
publish = false

# Fora do workspace de propósito, como os spikes anteriores. Existe para
# responder **uma** pergunta — quanto se ganha trocando o laço de conversão do
# `captura/windows.rs` — e morre com a resposta. Nada pode depender dele.
[workspace]

[dependencies]
dcv-color-primitives = "1.0.0"

# O alvo verdadeiro: a medição mostrou que a cor é 6% do custo desta função e a
# escala é 94%. Entrou depois da primeira rodada, por causa do que ela mostrou.
fast_image_resize = "6.1.0"

# Otimizado, porque medir laço apertado em debug mede o debug.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
