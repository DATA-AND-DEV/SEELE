[package]
name = "seele-fuzz"
description = "Fuzz targets for the untrusted-input surface of seele-proto."
version = "0.0.0"
edition = "2021"
publish = false

# Excluded from the main workspace: fuzzing needs nightly, and `cargo build
# --workspace` on stable must not try to compile this.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
seele-proto = { path = "../crates/seele-proto" }
# O envelope dos canais (contrato D4) mora no enlace, e não no proto: é dele
# que o `ler` sai, e é ele que os dois lados chamam antes de qualquer outra
# coisa.
seele-enlace = { path = "../crates/seele-enlace" }

[[bin]]
name = "version_negotiation"
path = "fuzz_targets/version_negotiation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "media_header"
path = "fuzz_targets/media_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_frame"
path = "fuzz_targets/control_frame.rs"
test = false
doc = false
bench = false

# O convite `seele://`, que chega colado de uma conversa e termina num
# `connect`.
[[bin]]
name = "uri"
path = "fuzz_targets/uri.rs"
test = false
doc = false
bench = false

# O datagrama do ponto de encontro, lido pelo ponto e pelo anfitrião antes de
# qualquer conferência.
[[bin]]
name = "datagrama_do_encontro"
path = "fuzz_targets/datagrama_do_encontro.rs"
test = false
doc = false
bench = false

# O corpo do `POST /sinal/1`, que o ponto lê de qualquer navegador (ADR 0063).
[[bin]]
name = "sinal_do_encontro"
path = "fuzz_targets/sinal_do_encontro.rs"
test = false
doc = false
bench = false

# O envelope de todo canal de dados menos a voz (contrato D4).
[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false
