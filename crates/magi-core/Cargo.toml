[package]
name = "magi-core"
description = "MAGI headless client: session, channels, audio wiring and event loop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# specs/01-arquitetura.md, dependency rule: `core` depends on `proto` and `audio`,
# never the other way round. Enforced by `cargo xtask check-deps`.
[dependencies]
magi-proto = { path = "../magi-proto" }
magi-audio = { path = "../magi-audio" }
quinn = "0.11.11"
rustls = "0.23.43"
tokio = { version = "1.53.1", features = ["full"] }
ed25519-dalek = "3.0.0"
rand = "0.10.2"
anyhow = "1.0.104"
thiserror = "2.0.19"
tracing = "0.1.44"
serde = "1.0.229"

[lints]
workspace = true
