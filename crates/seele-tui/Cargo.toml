[package]
name = "seele-tui"
description = "Entry Plug — the terminal client. The reference interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# ADR 0002: a shell sees `seele-core` and nothing else. If the TUI ever needs to
# name an `ssrc`, the logic that needs it belongs in the core.
[dependencies]
# The shell formats time; the core deals in monotonic durations only.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = "3"
rand = "0.10"
anyhow = "1.0.104"
crossterm = "0.29.0"
seele-core = { path = "../seele-core" }
# `--hospedar` sobe um Dogma neste processo. Exceção nomeada na regra de
# dependência (xtask/src/check_deps.rs): o cliente contém os dois papéis, e
# nenhuma lógica de protocolo entra na casca por causa disso.
seele-server = { path = "../seele-server" }
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["full"] }
unicode-width = "0.2.2"

[lints]
workspace = true

[lib]
name = "seele_tui"
path = "src/lib.rs"

[[bin]]
name = "plug"
path = "src/main.rs"
