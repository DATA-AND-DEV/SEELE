[package]
name = "seele-conformance"
description = "End-to-end protocol tests. The one crate allowed to see both ends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# This crate exists because an end-to-end protocol test needs a server and a
# client at once, and ADR 0002 forbids either of them depending on the other —
# for good reason: the daemon must not link the client, and the client must not
# link the daemon.
#
# Putting the test here keeps that rule intact and gives the exception a name.
# It ships nothing: `src/lib.rs` is empty and every dependency is a dev one.
[dependencies]

[dev-dependencies]
seele-proto = { path = "../seele-proto" }
# The soak drives the real pipeline: codec, jitter buffer, network simulator.
#
# Com o aparelho de mentira (lote P61): um id com `device::mentira::PREFIXO`
# abre um par de aparelhos que não é placa de som nenhuma, pelo mesmo
# `device::open` de sempre. É por ele que a voz da FFI abre aqui inteira, sem o
# microfone nem a saída da máquina. Os outros ids não mudam de comportamento, e
# a feature não se une ao build do produto (resolvedor 2): ver o
# `compile_error!` em `seele-audio/src/device/mentira.rs`.
seele-audio = { path = "../seele-audio", features = ["aparelho-de-mentira"] }
# Com o gêmeo do guarda, do lado de quem liga (`encontro::recusar_a_producao`):
# um teste que ia perguntar à VPS de produção reprova antes do primeiro pacote.
seele-core = { path = "../seele-core", features = ["recusar-encontro-de-producao"] }
# Com o guarda que faz um teste reprovar quando ia falar com o ponto de
# encontro de produção (`alcance::encontro::recusar_a_producao`). Só aqui, numa
# dependência de teste: o binário do produto não a leva.
seele-server = { path = "../seele-server", features = ["recusar-encontro-de-producao"] }
# Com o retrato sem rede (`sem_rede::retratos`), para a conformidade dos dois
# produtores de retrato: o desktop e o navegador, com as mesmas mensagens.
seele-ffi = { path = "../seele-ffi", features = ["conformidade"] }
# O outro produtor: a sessão do navegador (`seele_web::sessao`), no nativo.
seele-web = { path = "../seele-web" }
# O ponto de encontro, para o teste do quarto: ele precisa das duas pontas — um
# anfitrião registrando e um cliente perguntando — com o serviço de verdade no
# meio, e este crate é o único lugar onde as duas cabem juntas.
seele-encontro = { path = "../seele-encontro" }
# The acceptance tests draw the real interface into an off-screen buffer.
ratatui = "0.30.2"
# O teste da troca de aparelho monta os erros que o sistema operacional manda
# pelo retorno do `cpal` e os empurra pelo caminho de verdade. Sem isto, ele
# teria de inventar o evento em vez de reproduzi-lo.
# Não custa compilação nenhuma: o `seele-audio` logo acima já traz este mesmo
# `cpal` 0.18.1, então nomeá-lo aqui só dá ao teste o direito de escrever
# `cpal::ErrorKind` — a caixa já ia ser compilada de todo jeito.
cpal = "0.18.1"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = "3"
rand = "0.10"
anyhow = "1"
tempfile = "3.27.0"
serde_json = "1.0.151"
# `tela_por_um_par.rs` fala QUIC cru — o par "compartilha" é deliberadamente um
# par cru, não um `Enlace` — e precisa das mesmas versões que `seele-server`
# usa, para o `AceitaQualquer` copiado de `subida_no_arranque.rs` bater com o
# tipo que `quinn` devolve.
quinn = "0.11.11"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "logging", "tls12"] }

[lints]
workspace = true
