[package]
name = "seele-proto"
description = "SEELE wire protocol: message types, serialization and versioning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# specs/01-arquitetura.md, dependency rule: `proto` depends on nobody.
# Enforced by `cargo xtask check-deps`.
[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.19"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
