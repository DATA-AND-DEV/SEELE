[package]
name = "seele-proto"
description = "SEELE wire protocol: message types, serialization and versioning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# specs/01-arquitetura.md, dependency rule: `proto` depends on nobody.
# Enforced by `cargo xtask check-deps`.
[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
# O manifesto de um MOD é JSON, e não postcard: ele é escrito à mão por
# terceiros e lido por uma pessoa antes de instalar (ADR 0045). Já está na
# árvore em `seele-app`, `seele-ffi` e `seele-server`, na mesma versão, então
# não há exceção nova no `deny.toml`.
serde_json = "1.0.151"
# A chave e a assinatura do `MORO2` (ENC/2, ADR 0062) viajam em base64url
# dentro do texto do datagrama. Já está na árvore pelo `seele-lancador` e pelo
# `seele-app`, na mesma versão; o motor `URL_SAFE_NO_PAD` recusa `=` e bits
# sobrando no fim, então cada chave tem uma escrita só.
base64 = "0.22"
sha2 = "0.11.0"
thiserror = "2.0.19"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
