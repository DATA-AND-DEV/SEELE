[package]
name = "seele-web"
description = "O cliente do celular, a parte que roda em wasm: o codec do seele-proto atrás de uma fronteira de JSON (ADR 0057)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# ADR 0057: nenhuma linha do protocolo é escrita em JavaScript. Este crate é
# onde o `postcard` mora no celular; a casca fala JSON com ele, e só move bytes
# opacos. Ele depende do `seele-proto` e das peças sem E/S que saíram do
# desktop para ele (a linha dele em `xtask/src/check_deps.rs`).
[dependencies]
seele-proto = { path = "../seele-proto" }
# O relógio de mídia e a tabela de quem fala da voz do desktop (Tarefa 3.3).
seele-voz = { path = "../seele-voz" }
# O `Room` e o retrato do desktop (Tarefa 2.2, fase 2): o navegador dobra as
# mesmas mensagens e monta o retrato com a mesma projeção.
seele-sessao = { path = "../seele-sessao", features = ["reducao"] }
# A fronteira com a casca. A mesma versão do `seele-proto`, que já o usa para
# o manifesto de MOD.
serde_json = "1.0.151"

# Um `.wasm` para a página (`cdylib`) e o crate para os testes nativos (`rlib`).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Duas funções só de teste na fronteira (`fronteira::prova`), para conferir os
# bytes-ouro dentro do `.wasm` pelo `cargo xtask web`. O `.wasm` da página sai
# sem elas.
prova = []

# **A folha de lints é copiada, e não herdada**, pela mesma razão do
# `seele-video` (ADR 0041) e do `seele-instalador` (ADR 0043): exportar uma
# função de um `.wasm` pede `unsafe`, e o `forbid` do workspace não se afrouxa
# nem dentro de um módulo. Aqui é `deny`, e o `allow` mora só em
# `src/fronteira.rs` (emenda de 08/10/2026 ao ADR 0057). O
# `xtask/tests/folha_de_lints.rs` confere que esta é a única diferença, e o
# `xtask/tests/fronteira_do_celular.rs`, que o `allow` não saiu da fronteira.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"
