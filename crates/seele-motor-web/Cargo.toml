[package]
name = "seele-motor-web"
description = "O motor de MODs do celular: a volta do seele-motor, a mesma do desktop, num Worker em wasm32-wasip1 (ADR 0057, D-web-1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# O executor AB do spike `mods-no-navegador`: este `.wasm` roda num Worker que a
# página cria de dentro de um `iframe` opaco. O `.wasm` importa só a WASI mínima
# que o Worker lhe dá, e o código do MOD só alcança o que o motor põe no
# contexto.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# **A volta é a do desktop, e só ela.** Este crate não tem `rquickjs`: quem
# avalia o código de um MOD é o `seele-motor`, e aqui mora só o embrulho do
# Worker (`Instancia`) e a fronteira. O guarda está em
# `xtask/tests/fronteira_do_celular.rs`.
#
# Para compilar para `wasm32-wasip1`, o `build.rs` do `rquickjs-sys` (pelo
# `seele-motor`) precisa de `WASI_SDK` apontando para o SDK que `cargo xtask
# wasi-sdk` conferiu. Sem ela, o `.cargo/config.toml` aponta para uma pasta que
# não existe, e o build para em vez de baixar sem conferir.
seele-motor = { path = "../seele-motor" }
# As falas do motor vão ao Worker em JSON (`ParaOFora::em_json`). A mesma
# versão do `seele-motor`.
serde_json = "1.0.151"

# **A folha de lints é copiada, e não herdada**: as funções que o Worker chama
# pedem `unsafe`, e o `forbid` do workspace não se afrouxa nem dentro
# de um módulo. Aqui é `deny`, e o `allow` mora só em `src/fronteira.rs` (emenda
# de 08/10/2026 ao ADR 0057, no molde do `seele-video` e do `seele-instalador`).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"
