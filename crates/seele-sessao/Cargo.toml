[package]
name = "seele-sessao"
description = "A sessão como o servidor a conta: o Room, a porta do assento e o SessionInfo, sem E/S, para o desktop e o navegador."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Só o protocolo (a linha dele em `xtask/src/check_deps.rs`): é o que deixa o
# navegador compilá-lo, e o `cargo xtask web` confere a cada vez.
[dependencies]
seele-proto = { path = "../seele-proto" }
# Os tipos de vista do retrato (`retrato`) vão à casca em JSON, como iam do
# `seele-ffi`. A mesma versão do `seele-proto`.
serde = { version = "1.0.229", features = ["derive"] }
# O `NomeRecusado` das regras do nome de um anexo (`nome_do_anexo`), que veio
# do `seele-core` com o `Error` dele. A mesma versão do `seele-proto`.
thiserror = "2.0.19"
# O catálogo de MODs (`catalogo`), que o desktop e o navegador leem pelas
# mesmas funções: o JSON dele, e a assinatura pelo mesmo `minisign-verify` do
# `seele-lancador`, na mesma versão. Os dois compilam para o navegador.
serde_json = "1.0.151"
minisign-verify = "0.2.5"
# A redução de uma imagem de MOD ao uso (`reducao`), só com a feature: o
# desktop e o navegador a ligam, e o resto do grafo não compila o `image`. A
# mesma versão e as mesmas features do `seele-app`.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"], optional = true }

[features]
# A redução de imagem (`reducao`), com o `image`.
reducao = ["dep:image"]

[lints]
workspace = true
