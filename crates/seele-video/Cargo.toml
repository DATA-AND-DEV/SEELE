[package]
name = "seele-video"
description = "Compartilhamento de tela: captura e codec H.264, do mesmo jeito que `seele-audio` guarda dispositivo e codec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# `specs/01-arquitetura.md`, regra de dependência: este crate vê `seele-proto` e
# mais nada. Guardado por `cargo xtask check-deps` (ADR 0002).
#
# **A aresta para `seele-proto` está permitida e ainda não é usada.** O que a
# fará existir é o §3.6 da spec do compartilhamento de tela — o cabeçalho do
# fluxo unidirecional, versionado pelo primeiro byte como todo frame de
# controle. Ele é o passo 3 da ordem de construção; este crate é o passo 1.
# Declarar a dependência antes de haver o que importar seria uma linha que
# ninguém consegue explicar.
[dependencies]
# A escolha do §2 da spec, e a árvore de execução dela é uma linha só: ele
# mesmo. Não compila C — gera as bindings com `bindgen` e faz `dlopen` do módulo
# do Cisco em tempo de execução, que é o que mantém a patente respondida em vez
# de contornada (§2, razão 3).
#
# Mesma família do `shiguredo_opus` que o ADR 0008 escolheu para a voz: mesmo
# mantenedor, mesmo trem de versões, e o `rust-toolchain.toml` já carrega
# `llvm-tools` por causa dela.
#
# **Dois custos de build que o §2 não previu**, os dois medidos por
# `spikes/tela-no-codec`: o `build.rs` faz `git clone --depth 1` do repositório
# do Cisco para pegar `codec_api.h`, então `cargo build` precisa de `git` e de
# **rede**; e o `bindgen` precisa de `libclang`. Continua sendo muito menos que
# nasm mais CMake — que é o custo que o `rustls` já recusou por escrito —, mas
# «zero ferramentas de build» está otimista por dois itens, e quem empacota
# precisa saber antes.
shiguredo_openh264 = "2026.2.0"
# Só para conferir o hash fixado do módulo que se baixa (§2: «hash fixado e
# conferido»). Não acrescenta nada à árvore: `seele-proto` já depende dele, na
# mesma versão.
sha2 = "0.11.0"
# Para expandir o `.bz2` que o Cisco publica — é assim que o arquivo é servido,
# e não há versão crua para baixar em vez dele.
#
# O `default` deste crate é `libbz2-rs-sys`, a porta em Rust dos mesmos que
# fizeram o `zlib-rs`: **não compila C**, o que importa aqui porque o
# `shiguredo_openh264` já cobra `git`, rede e `libclang` de quem compila, e
# somar um toolchain de C a essa conta era o custo que o §2 recusou por escrito
# quando pesou nasm mais CMake.
bzip2 = "0.6.1"
tracing = "0.1.44"

# ---- captura, uma por sistema ----
#
# Postas por quem coordena, e não pelos dois agentes que escreveram
# `captura/macos.rs` e `captura/windows.rs`: um `Cargo.toml` editado por duas
# frentes em paralelo é a colisão que o `captura/mod.rs` vazio existe para
# evitar. Eles pediram; esta é a resposta.

# ScreenCaptureKit, a escolha do §1. `core-graphics` acompanha por causa de
# `CGPreflightScreenCaptureAccess`/`CGRequestScreenCaptureAccess`, que é como se
# pergunta ao TCC **sem `unsafe`** — e `unsafe_code` é `forbid` aqui.
#
# `core-graphics` e não `objc2-core-graphics`: o primeiro **já está no
# `Cargo.lock`**, trazido pelo `tao` do Tauri, e portanto acrescenta zero à
# árvore. O segundo serviria igual e traria uma segunda família.
#
# **O custo que o §1 não previu, e ele é do tipo que o §2 já recusou uma vez:**
# o `build.rs` do `screencapturekit` roda `swift build`. Exige toolchain Swift
# na máquina que compila, não só `cargo` — é o mesmo formato do nasm que o
# comentário do `rustls` recusou por escrito. E ele publica o rpath do Swift por
# `cargo:rustc-link-arg`, que **o Cargo ignora quando vem de dependência**: sem
# a linha em `.cargo/config.toml`, o binário linka e morre no `dyld`.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "8.0.1"
core-graphics = "0.25"
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["std", "VTBase", "VTErrors", "VTSession", "VTCompressionSession", "VTCompressionProperties", "objc2-core-media", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "CVPixelFormatDescription"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMTime", "CMSampleBuffer", "CMFormatDescription", "CMBlockBuffer"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFString", "CFNumber"] }

# Windows Graphics Capture. O §1 pesou as duas portas e esta é a que não exige
# `unsafe`: a alternativa é WGC crua pelo `windows` 0.61, com zero crates novos
# e uma exceção nomeada ao `forbid unsafe_code` — que a spec recusou para a v1.
#
# Custo aceito e escrito: 31 crates, `windows` 0.62 ao lado do 0.61 já na árvore
# (`multiple-versions = "warn"` no `deny.toml`), e um `rayon` que só entra pelos
# caminhos que este código não chama.
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0.1"

# As duas que substituíram o laço de conversão à mão. O `spikes/tela-na-cor`
# achou o motivo: dos 8 ms que o laço gastava por quadro, **94% eram
# redimensionar** e só 6% converter cor — o contrário do que todo mundo supunha,
# e a razão de trocar só a conversão não adiantar nada.
#
# Medido no Ryzen 7 5800X3D, que é o alvo: **17,69 ms → 7,42 ms, 2,4×.** A
# tabela com os dois lados da conta está no cabeçalho do
# `captura/reamostragem.rs`.
#
# Custo aceito, contado no `Cargo.lock` e não estimado: **4 crates novos** —
# elas duas, mais `pastey` e `spin` —, e uma segunda versão de `itertools`, que
# o `multiple-versions = "warn"` do `deny.toml` aceita reclamando. O resto da
# árvore das duas já estava aqui. (Uma estimativa anterior falava em ~27; ela
# saiu de compilá-las isoladas num spike, onde nada mais existia para
# compartilhar.)
#
# O macOS não precisa de nenhuma das duas: pede `420v` à ScreenCaptureKit, e o
# compositor já entrega reduzido e no formato certo. É a mesma coisa que este
# commit passa a fazer no Windows — só que lá o compositor não faz por nós.
#
# `dcv-color-primitives` é MIT-0 e vem do NICE DCV, o desktop remoto da Amazon —
# converter pixel de tela em formato de vídeo é a razão de ela existir. Ela tem
# NEON além de AVX2, o que a documentação não diz e a própria biblioteca
# reporta; foi o que permitiu medir num Mac o que vai rodar num Ryzen.
dcv-color-primitives = "1.0.0"
fast_image_resize = "6.1.0"
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation", "Win32_System_Variant", "Win32_Media_KernelStreaming", "Win32_System_Ole"] }

# As mesmas, de novo, para os testes.
#
# O `captura/reamostragem.rs` é compilado sob `test` em toda plataforma de
# propósito — quatro dos cinco testes daquela aritmética nunca rodaram fora do
# Windows, e essa era a doença. Sem estas duas linhas, tirá-los de trás do
# `cfg` não adiantaria nada: o módulo não compilaria no Mac.
#
# Repetir a versão em dois lugares é uma trava a manter — se divergirem, o teste
# passa a exercitar uma biblioteca diferente da que vai para produção. Está aqui
# em vez de nas dependências normais porque o preço de errar isso é menor que o
# de pôr 27 crates no binário que o macOS e o Linux distribuem.
[dev-dependencies]
dcv-color-primitives = "1.0.0"
fast_image_resize = "6.1.0"

# **O único crate que não herda a folha do workspace**, e o ADR 0041 diz por quê.
#
# O workspace tem `unsafe_code = "forbid"`, um nível que nenhum `allow` local
# derruba — e é essa a propriedade que se quer, escrita no próprio `Cargo.toml`
# de lá. Aqui ela impediria a única coisa que equilibra a conta de quem
# transmite: o codificador do sistema. VideoToolbox é C, chamá-lo é `unsafe`, e
# invólucro seguro não existe — a alternativa a esta exceção não é outro crate,
# é não ter codec por hardware.
#
# `deny` e não `forbid`: o `allow` vive num módulo só, `codec/macos.rs`, e em
# qualquer outro arquivo deste crate o compilador continua recusando. A garantia
# deixa de ser «não existe `unsafe` aqui» e passa a ser «existe num lugar
# nomeado», que é a mais forte que este trabalho admite.
#
# O resto da folha é copiado do workspace de propósito, e não herdado em parte:
# `[lints]` é tudo ou nada, e uma cópia que esquecesse `missing_docs` afrouxaria
# em silêncio uma regra que não tem nada a ver com esta decisão.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"

