[package]
name = "seele-core"
description = "SEELE headless client: session, channels, audio wiring and event loop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# specs/01-arquitetura.md, dependency rule: `core` depends on `proto` and `audio`,
# never the other way round. Enforced by `cargo xtask check-deps`.
[dependencies]
seele-proto = { path = "../seele-proto" }
seele-audio = { path = "../seele-audio" }
quinn = "0.11.11"
# Só o provider `ring`, que é o que instalamos em tempo de execução. Os
# defaults do rustls trazem o `aws-lc-rs` junto, e ele exige CMake e NASM
# para compilar — num projeto cujo argumento inteiro é um binário
# auto-contido, arrastar uma segunda pilha de cripto em C que nunca é
# chamada é custo puro. No Windows é a diferença entre instalar o Rust e
# instalar o Rust mais duas ferramentas de build.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio = { version = "1.53.1", features = ["full"] }
ed25519-dalek = "3.0.0"
rand = "0.10.2"
anyhow = "1.0.104"
thiserror = "2.0.19"
tracing = "0.1.44"
serde = "1.0.229"

[dev-dependencies]
# Só para o par QUIC do teste de dessincronização do `frame`. Já está na árvore
# do workspace via `seele-server`, então não acrescenta superfície de auditoria.
rcgen = "0.14.8"

[lints]
workspace = true
