[package]
name = "seele-core"
description = "SEELE headless client: session, channels, audio wiring and event loop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# specs/01-arquitetura.md, dependency rule: `core` depends on `proto` and `audio`,
# never the other way round. Enforced by `cargo xtask check-deps`.
[dependencies]
seele-proto = { path = "../seele-proto" }
# O `Room`, a porta do assento e o `SessionInfo`, sem E/S (Tarefa 2.2 da F4).
seele-sessao = { path = "../seele-sessao" }
seele-audio = { path = "../seele-audio" }
# A segunda folha de mídia, ao lado de `seele-audio` e com a mesma vizinhança —
# a aresta que o ADR 0002 já permitia e que ninguém tinha usado.
#
# **Ela existe porque a decisão de o que transmitir mora deste lado.** O §3.2 da
# spec de compartilhamento de tela põe o teto pendurado no sinal da voz, que é
# conta de `seele-core`; o codificador só sabe obedecer a um número. Sem esta
# linha, captura, codificador e teto eram três peças que ninguém juntava —
# `crate::video` é onde elas se encontram.
#
# **O que ela arrasta, e é preciso saber antes de compilar:** o
# `shiguredo_openh264` faz `git clone --depth 1` do repositório do Cisco no
# `build.rs` (então `cargo build` precisa de `git` e de rede) e gera bindings
# com `bindgen` (então precisa de `libclang`); no macOS o `screencapturekit`
# roda `swift build` e exige a linha de `-rpath` que mora em
# `.cargo/config.toml`. Quem compila `seele-core` passa a pagar isso — inclusive
# quem só queria a voz.
seele-video = { path = "../seele-video" }
# O transporte da 0.17 (contrato da fase 2, D1): WebRTC por `str0m`, o mesmo
# crate do `seele-server`. Substitui o `quinn` e o `rustls` que moravam aqui: a
# 0.17 quebra a compatibilidade com a 0.16 de propósito, e não há transporte
# duplo. O ADR 0002 é emendado por este crate comum (os dois setups QUIC
# diferentes que o justificavam deixaram de existir).
seele-enlace = { path = "../seele-enlace" }
tokio = { version = "1.53.1", features = ["full"] }
# Só por causa do `IPV6_V6ONLY`, cujo padrão difere entre Linux, macOS e
# Windows. A ponta WebRTC de cada sessão é aberta sobre um socket nosso, de
# pilha dupla (`client::socket_de_quem_conecta`), e um socket aberto por nós
# precisa desse cuidado à mão. O `seele-enlace` já traz este crate.
socket2 = "0.6.5"
ed25519-dalek = "3.0.0"
rand = "0.10.2"
anyhow = "1.0.104"
thiserror = "2.0.19"
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
# Os aceites de máquina (`aceites_de_maquina`) guardam a oferta inteira, uma
# linha JSON por aceite. A mesma versão do `seele-proto`.
serde_json = "1.0.151"
# Para `enlace::Motor` saber os próprios endereços de rede local ao declarar
# identidade no caminho entre pares (`EmprestarSubida.locais`) — a std não
# enumera interfaces. Mesma versão que `seele-server::alcance::interfaces` já
# usa para o mesmo tipo de pergunta, então já está na árvore do workspace e
# não acrescenta superfície de auditoria. ADR 0002 proíbe este crate de
# depender de `seele-server`, então a pergunta é refeita aqui, sem a
# ordenação por heurística de VPN que só importa para o convite.
if-addrs = "0.15"
# O poder `programa` da API 8 (`crate::programa`): baixar artefatos de centenas
# de MB com hash declarado. **Zero crate novo no `Cargo.lock`**, medido: o
# `seele-app` já traz este `reqwest` com esta mesma feature (o atualizador do
# ADR 0026), e o `rustls` com `ring` já está aqui pelo mesmo app e pelo
# `seele-server`. `default-features = false` mantém fora o `native-tls` e o
# `gzip` — um corpo descomprimido no caminho não teria mais o tamanho que o MOD
# declarou. O que entra é uma aresta, não uma árvore.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "logging", "tls12"] }
# Os três hashes que as origens publicam (spec da API 8, §5): a Mojang dá
# `sha1`, a Adoptium `sha256`, o `.mrpack` `sha1` e `sha512`. As duas versões já
# estão na árvore deste crate, pelo STUN e pelo SRTP do `seele-enlace`.
sha1 = "0.10.7"
sha2 = "0.10.9"
# `maquina.programa.desempacotar` (API 8 parte 4): o Java da Adoptium vem em
# `.tar.gz` no Mac e no Linux, e em `.zip` no Windows. As mesmas duas que o
# `seele-app` e o `seele-instalador` já usam para o pacote do atualizador:
# zero crate novo no `Cargo.lock`. O `.zip` é lido à mão (`desempacotar.rs`),
# pelo `flate2`, para não trazer o `zip` e a árvore dele.
tar = "0.4"
flate2 = "1"

[features]
# O gêmeo do guarda da F5 (`seele-server`, a mesma feature), do lado de quem
# liga: um teste que ia perguntar à VPS de produção, pelo quarto ou pela batida,
# reprova antes do primeiro pacote (`encontro::recusar_a_producao`). Os testes
# deste crate o têm pelo `cfg(test)`; os do `seele-conformance` não veem esse
# `cfg`, e é para eles que a feature existe, pela `[dev-dependencies]` dele.
#
# **Nunca ligada no binário do produto**: com o resolvedor 2, a feature de uma
# dependência de teste não se une ao build normal, e um `compile_error!` no
# `encontro.rs` recusa um build otimizado com ela.
recusar-encontro-de-producao = []
# A redução de imagem do `seele-sessao` (`seele_core::reducao`), para o
# `seele-ffi` a reexportar à casca do desktop.
reducao = ["seele-sessao/reducao"]
# O aparelho de mentira do `seele-audio`, reexportado em `aparelho_de_mentira`
# para a casca o ver pela cadeia app -> ffi -> core -> audio. O `seele-audio`
# recusa (`compile_error!`) o recurso num build otimizado, e a cadeia herda.
aparelho-de-mentira = ["seele-audio/aparelho-de-mentira"]

# **O processo do MOD morre com os netos** (revisão final da API 8, I9): o
# filho de `programa.rodar` nasce num grupo de processos próprio, e parar mata
# o grupo (`killpg`). O `std` cria o grupo (`process_group`), mas não manda
# sinal a um grupo, e o workspace proíbe `unsafe`. **Zero crate novo no
# `Cargo.lock`**: o `nix` 0.29 já está na árvore (pelo `mac_address` e pelo
# `termwiz`); entra uma aresta, só com `signal`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }

# **E no Windows, pela tarefa** (decisão W3 de
# `2026-10-31-api-8-windows-decisoes.md`): o filho entra num *Job Object* com
# `KILL_ON_JOB_CLOSE`, e parar mata a tarefa. **Zero crate novo no
# `Cargo.lock`**: o `windows` 0.62 já vem pelo `seele-audio` e pelo
# `seele-video` (os dois são dependências deste crate); entram as features
# das tarefas (`Win32_System_JobObjects`, e `Win32_Security` e
# `Win32_System_Threading`, que os tipos dela pedem).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# O relógio virtual do tokio, e nada além dele.
#
# `features = ["full"]` **não** inclui `test-util`, que é o que dá
# `#[tokio::test(start_paused = true)]`. Sem ele, provar que a corrida do ADR
# 0037 não espera o primeiro candidato terminar exigiria esperas de verdade — e
# um dos testes finge um candidato que demora cem segundos, justamente porque
# «nunca termina» é a condição que ele encena.
#
# Custo nenhum sobre o que já se audita: mesmo crate, já na árvore, e
# `dev-dependencies` não entra em binário publicado.
tokio = { version = "1.53.1", features = ["test-util"] }
# Um servidor HTTPS de verdade em `127.0.0.1` para o teste do `programa`
# (`tests/programa_https.rs`): o corte do corpo grande tem de ser provado no
# `reqwest` real, e não só na origem de mentira. As duas já estão no
# `Cargo.lock` (o `rcgen` pelo `seele-server`, o `tokio-rustls` pelo `reqwest`).
rcgen = "0.14.8"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }

# **A folha do workspace, com uma troca só: `unsafe_code` em `deny`, e não em
# `forbid`** (decisão W3). O `forbid` não se derruba com `allow`, e a árvore
# do processo do jogo no Windows só morre por um *Job Object*, que é FFI do
# `kernel32` sem invólucro seguro nas dependências. O `allow` vive num módulo
# só, `programa/tarefa_windows.rs`, compilado só no Windows; em qualquer outro
# arquivo deste crate o compilador continua recusando `unsafe` — a mesma
# régua do `seele-video` (ADR 0041). O resto é copiado do workspace, e não
# herdado em parte: `[lints]` é tudo ou nada.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"
