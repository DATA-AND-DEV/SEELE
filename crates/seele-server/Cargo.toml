[package]
name = "seele-server"
description = "seeled — o daemon do SEELE. Uma instância é um servidor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# ADR 0002: the daemon sees the wire format and nothing else. It must not depend
# on `seele-core` (the headless *client*) nor on `seele-audio` — specs/04 states
# the server never decodes Opus, and linking the audio stack would drag cpal and
# libopus into a process that has to fit in 1 vCPU / 512 MB.
[dependencies]
anyhow = "1.0.104"
# PCP (RFC 6887) — degrau 2 do ADR 0022, a metade que faltava. Rust puro, e a
# árvore inteira dele já estava aqui: `bytes`, `displaydoc`, `num_enum`, `rand`,
# `thiserror`, `tokio` e `tracing` vieram com o quinn e com o rusqlite. Custo
# medido contra o `Cargo.lock` deste workspace: **1 crate novo**, o próprio.
# Ver `alcance::pcp` para por que PCP e não o UPnP que o degrau 3 já fala.
crab_nat = "0.8.1"
ed25519-dalek = "3.0.0"
# UPnP IGD — degrau 3 do ADR 0022. Escolhido depois de medir a árvore de cada
# candidato; `alcance::porta` registra por que este e não os outros, e o que ele
# arrasta junto que não deveria.
igd-next = { version = "0.17.1", default-features = false, features = ["aio_tokio"] }
# A peça que o PCP não tem: descobrir o roteador. O UPnP acha por multicast
# SSDP; a RFC 6887 manda o cliente falar com o gateway padrão, e ler a tabela de
# rotas é código por sistema — `getifaddrs` não a responde, e fazer à mão seria
# FFI, que o workspace proíbe (`unsafe_code = "forbid"`).
#
# `default-features = false` é o que torna isto pagável, e é medido: as features
# `apple-wifi-extra` e `apple-system-configuration-extra` **não** são padrão na
# 0.46, e são elas que traziam `objc2-core-wlan`/`objc2-security` — a conta de
# 31 crates que fez o `portmapper` ser recusado em `alcance::porta`. Com só
# `gateway`, e medido contra o `Cargo.lock` deste workspace no **macOS**
# (aarch64-apple-darwin), entram **3 crates novos**: `netdev`, `mac-addr` e
# `objc2-system-configuration`. O resto da árvore — `ipnet`, `libc`, `plist`,
# `objc2-core-foundation` — já estava aqui. O número muda por sistema: no Linux
# entram os `netlink-*` no lugar dos `objc2-*`, e no Windows nada além do
# `windows-sys` que o quinn já traz. Ver `alcance::pcp::roteador_padrao`.
netdev = { version = "0.46.1", default-features = false, features = ["gateway"] }
# O interpretador dos MODs (ADR 0045). QuickJS pelo binding, e não Boa: o spike
# `spikes/mod-em-js/` mediu 11× menos binário (+1 098 KiB contra +12 088), ~2×
# menos custo por chamada (39 ns contra 73) e ~4× menos memória com 50 contextos
# (5,9 MB contra 24,8). Contra o orçamento de 1 vCPU / 512 MB que o
# `check_deps` protege, a diferença decide.
#
# MIT, então nenhuma exceção nova no `deny.toml`. Custo medido contra o
# `Cargo.lock` deste workspace: **4 crates novas** — `rquickjs`,
# `rquickjs-core`, `rquickjs-sys` e `relative-path`. É menos que o `netdev`
# acima custou.
#
# **O custo que ele traz, e é novo neste projeto:** `rquickjs-sys` compila fonte
# em C, então construir este crate passa a exigir um compilador de C. Existe nos
# três alvos — Xcode CLT, MSVC nos runners de Windows, `cc` no Linux — e é a
# primeira vez que o Rust sozinho não basta.
rquickjs = "0.12.2"
# A rede que um MOD alcança (ADR 0045, bloco `world`). `blocking`, porque quem
# chama é a thread dos MODs, que de propósito não é do Tokio.
#
# Custo medido contra o `Cargo.lock`: **0 crates novas** — o `seele-app` já
# traz esta versão inteira pelo atualizador do ADR 0026, e `rustls` e `ring`
# já estavam aqui pelo quinn. O que entra é uma aresta, não uma árvore.
#
# `default-features = false` mantém fora o `native-tls`: uma segunda pilha de
# TLS num binário que já tem a do quinn seria duas de tudo.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    # Mesma feature que o `seele-app` já usa, e pelo mesmo motivo: o provedor
    # de criptografia é escolhido pelo processo, e duas escolhas no mesmo
    # binário seriam duas pilhas de TLS.
    "rustls-no-provider",
] }
seele-proto = { path = "../seele-proto" }
quinn = "0.11.11"
rand = "0.10.2"
rcgen = "0.14.8"
rusqlite = { version = "0.40.1", features = ["bundled"] }
# Só o provider `ring`, que é o que instalamos em tempo de execução. Os
# defaults do rustls trazem o `aws-lc-rs` junto, e ele exige CMake e NASM
# para compilar — num projeto cujo argumento inteiro é um binário
# auto-contido, arrastar uma segunda pilha de cripto em C que nunca é
# chamada é custo puro. No Windows é a diferença entre instalar o Rust e
# instalar o Rust mais duas ferramentas de build.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "logging", "tls12"] }
# A WebTransport do navegador (ADR 0057; Tarefa 2.6 da F4): adota a conexão
# `h3` que o `quinn` deste mesmo endpoint aceitou (`with_quic_connecting`), e
# entrega o fluxo QUIC de baixo, que o `frame.rs` lê como o do nativo. A versão
# fixa é a que o spike `alpn-no-mesmo-socket` mediu no iPhone (a medição 3).
# Sem o `self-signed` e sem o `aws-lc-rs`: os certificados são os do `tls.rs`,
# e o provider é o `ring`, como o do resto.
wtransport = { version = "=0.7.2", default-features = false, features = ["ring", "quinn"] }
serde = "1.0.229"
serde_json = "1.0.151"
# Só por causa de `IPV6_V6ONLY`, cujo padrão difere entre Linux, macOS e
# Windows — ver `alcance::abrir_escuta`. A std não expõe a opção, e o quinn já
# traz este crate (via `quinn-udp`), então nada novo entra na árvore.
socket2 = { workspace = true }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
argon2 = "0.5.3"
if-addrs = "0.15"

[lints]
workspace = true

[lib]
name = "seele_server"
path = "src/lib.rs"

[[bin]]
name = "seeled"
path = "src/main.rs"

[features]
# Faz um teste que ia falar com o ponto de encontro de produção reprovar antes
# do primeiro pacote, com a frase de `alcance::encontro::recusar_a_producao`.
# Os testes deste crate o têm pelo `cfg(test)`; os do `seele-conformance` não
# veem esse `cfg`, e é para eles que a feature existe.
#
# **Nunca ligada no binário do produto**: só a `[dev-dependencies]` do
# `seele-conformance` a pede, e com o resolvedor 2 a feature de uma dependência
# de teste não se une ao build normal. É o mesmo desenho da `fixtures` do
# `seele-lancador`.
#
# É a **segunda parede**. A primeira é o padrão: sem `$SEELE_ENCONTRO`,
# `Hospedagem::iniciar` não convoca ponto de encontro nenhum, e só a produção
# pede o do projeto (`iniciar_com_o_ponto_padrao`). Esquecer o ambiente custa
# «sem degrau 4», e não um servidor de teste no quarto de produção. O guarda
# pega o que sobra: um teste que aponta a VPS de propósito, ou que chama a
# função da produção.
#
# **O que ela não alcança sozinha:** os testes de `tests/` deste crate rodados
# com `cargo test -p seele-server`. Eles não veem o `cfg(test)`, e ligá-la para
# eles exigiria o crate depender de si mesmo, aresta que o `cargo xtask
# check-deps` recusa. Com o padrão seguro, isso perdeu o perigo: um teste dali
# que esqueça o ambiente fica sem ponto. Num `cargo test --workspace` (a CI, a
# bateria da integração) a feature se une pela dependência do
# `seele-conformance` e os alcança também.
recusar-encontro-de-producao = []

[dev-dependencies]
tempfile = "3.27.0"
# O `test-util`, para o `#[tokio::test(start_paused = true)]`: provar que a sala
# diz «o ponto não respondeu ao ENC/2» depois de dois reavivamentos de 15 s
# exigiria, sem ele, esperar meio minuto de verdade. Mesmo crate, já na árvore,
# e `dev-dependencies` não entra em binário publicado.
tokio = { version = "1.53.1", features = ["test-util"] }
