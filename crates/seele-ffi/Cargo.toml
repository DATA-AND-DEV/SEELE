[package]
name = "seele-ffi"
description = "The surface the graphical shells speak to. specs/06-clientes-gui.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# ADR 0002: a shell-facing crate sees `seele-core` and nothing else. ADR 0018:
# the shape here is what `uniffi` requires, without the dependency until M6
# brings a consumer that needs generated bindings.
[dependencies]
# The Tauri shell talks to its webview in JSON. See the note in `types`.
serde = { version = "1", features = ["derive"] }
# A chave de idempotência da mensagem é sorteada no arranque do processo, e
# não contada a partir de 1 — ver `next_client_message_id` e a pendência 19.
rand = "0.10"
# Com a redução de imagem de MOD (`seele_ffi::reducao`), que a casca usa.
seele-core = { path = "../seele-core", features = ["reducao"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
# Só para ler de volta o JSON que a casca gráfica lê. A faixa cruza esta
# fronteira **pelo nome**, e um teste que compara enums em Rust não vê o nome
# mudar. Já está na árvore via `seele-app`, então não acrescenta superfície.
serde_json = "1.0.151"

[features]
# O retrato sem rede (`sem_rede::retratos`), para a conformidade dos dois
# produtores de retrato (fase 2 da Tarefa 2.2 da F4). Só o `seele-conformance`
# a liga: o produto não leva uma conexão de mentira.
conformidade = []

[lints]
workspace = true

[lib]
name = "seele_ffi"
path = "src/lib.rs"
