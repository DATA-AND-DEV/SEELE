[package]
name = "magi-ffi"
description = "The surface the graphical shells speak to. specs/06-clientes-gui.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# ADR 0002: a shell-facing crate sees `magi-core` and nothing else. ADR 0018:
# the shape here is what `uniffi` requires, without the dependency until M6
# brings a consumer that needs generated bindings.
[dependencies]
# The Tauri shell talks to its webview in JSON. See the note in `types`.
serde = { version = "1", features = ["derive"] }
magi-core = { path = "../magi-core" }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"

[lints]
workspace = true

[lib]
name = "magi_ffi"
path = "src/lib.rs"
