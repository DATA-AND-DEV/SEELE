[package]
name = "magi-server"
description = "magid — the MAGI daemon. One instance is a Dogma Central."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# ADR 0002: the daemon sees the wire format and nothing else. It must not depend
# on `magi-core` (the headless *client*) nor on `magi-audio` — specs/04 states
# the server never decodes Opus, and linking the audio stack would drag cpal and
# libopus into a process that has to fit in 1 vCPU / 512 MB.
[dependencies]
anyhow = "1.0.104"
ed25519-dalek = "3.0.0"
magi-proto = { path = "../magi-proto" }
quinn = "0.11.11"
rand = "0.10.2"
rcgen = "0.14.8"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rustls = "0.23.43"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[lib]
name = "magi_server"
path = "src/lib.rs"

[[bin]]
name = "magid"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
