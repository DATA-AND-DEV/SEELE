[package]
name = "seele-encontro"
description = "O ponto de encontro do degrau 4 do ADR 0022: apresenta duas máquinas e sai."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# O formato do que passa pelo fio é `seele-proto` — o mesmo motivo pelo qual
# ele existe. Nada de tokio, nada de rede assíncrona: este processo trata um
# datagrama por vez (96 bytes no ENC/1, 384 no ENC/2), e o que ele guarda entre
# um e outro são os dois quartos e o limite por prefixo, em memória. Um laço
# bloqueante por família de endereço faz isso em duas linhas. `cargo xtask
# check-deps` guarda a aresta (ADR 0002).
#
# O objetivo é que subir o seu seja uma linha. Uma árvore de dependências grande
# aqui tornaria «o ponto de encontro é trocável» uma ficção educada.
[dependencies]
seele-proto = { path = "../seele-proto" }
# Só para dizer `IPV6_V6ONLY` em voz alta — a `std` não tem como. Sem isso o
# Linux faz o socket IPv6 de pilha dupla, ele colide com o IPv4 que já subiu, e
# o serviço fica só-IPv4 sem que ninguém repare. Aconteceu numa VPS de verdade.
#
# Não cresce a árvore: `seele-server` já usa `socket2` pelo mesmo motivo, e pelo
# mesmo defeito, um degrau abaixo.
socket2 = { workspace = true }
# A assinatura do `MORO2` (ENC/2, ADR 0062). O ponto é quem **confere** o
# registro da sala: sem isto, quem quisesse tomar a marca de uma pessoa bastava
# mandar o pedido antes dela. Já está na árvore pelo `seele-server`, pelo
# `seele-core` e pelo `seele-conformance`, na mesma versão.
ed25519-dalek = "3.0.0"

[lints]
workspace = true

[lib]
name = "seele_encontro"
path = "src/lib.rs"

[[bin]]
name = "seele-encontro"
path = "src/main.rs"

# `test = true` porque `sondar` tem teste próprio, provando que ele classifica
# um ponto de encontro velho como velho e não como no ar — sem isto `cargo
# test` nunca compilaria nem rodaria esse teste.
[[example]]
name = "sondar"
path = "examples/sondar.rs"
test = true
