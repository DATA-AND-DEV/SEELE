[package]
name = "seele-audio"
description = "SEELE audio pipeline: capture, codec, jitter buffer and mixing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# specs/01-arquitetura.md, dependency rule: `audio` depends only on `proto`.
# Enforced by `cargo xtask check-deps`.
[dependencies]
audioadapter-buffers = "4"
cpal = "0.18.1"
seele-proto = { path = "../seele-proto" }
rtrb = "0.3.4"
rubato = "4.0.0"
shiguredo_opus = { workspace = true }
# The codec reports libopus failures to the log rather than across an API:
# a C function name and an error code help a developer and tell a pilot nothing.
tracing = "0.1.44"
thiserror = "2.0.19"

[lints]
workspace = true

[dev-dependencies]
assert_no_alloc = "1.1.2"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "opus_frame"
harness = false

# O pacote pré-compilado do `shiguredo_opus` está quebrado no Windows: o arquivo
# publicado traz `lib/opus.lib`, e o build script procura `libopus.a` fixo — a
# compilação morre logo depois de baixar e verificar o checksum. Conferi o
# conteúdo do `.tar.gz` publicado; é defeito do crate, não nosso.
#
# `source-build` compila o libopus do código-fonte e contorna. Não exige CMake
# do sistema: o `shiguredo_cmake` baixa o seu próprio, o que de quebra evita a
# incompatibilidade com CMake 4 que derrubou o `audiopus` em M0.4 (ADR 0008).
#
# Só no Windows. Compilar do fonte custa cerca de meio minuto por build limpo, e
# as outras plataformas têm um pré-compilado que funciona.
[target.'cfg(windows)'.dependencies]
shiguredo_opus = { workspace = true, features = ["source-build"] }
