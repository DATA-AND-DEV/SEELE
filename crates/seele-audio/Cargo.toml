[package]
name = "seele-audio"
description = "SEELE audio pipeline: capture, codec, jitter buffer and mixing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# specs/01-arquitetura.md, dependency rule: `audio` depends only on `proto`.
# Enforced by `cargo xtask check-deps`.
[dependencies]
audioadapter-buffers = "4"
cpal = "0.18.1"
seele-proto = { path = "../seele-proto" }
rtrb = "0.3.4"
rubato = "4.0.0"
# `source-build` em toda plataforma: compila o libopus do código-fonte em vez
# de baixar o pré-compilado do crate. Não é preferência, é que o pré-compilado
# não serve para nós em três frentes, todas verificadas:
#
#   - **Windows** publica `lib/opus.lib` e o build script procura `libopus.a`
#     fixo. Baixei o `.tar.gz` e conferi; o build morre depois de verificar o
#     checksum com sucesso.
#   - **macOS Intel não existe** no mapa de alvos, então um `.dmg` universal é
#     impossível pelo caminho pré-compilado.
#   - **Linux entra em pânico fora do Ubuntu 22/24/26.** Num produto cujo
#     argumento é ser auto-hospedado, um servidor que só compila numa distro
#     não é uma limitação aceitável.
#
# Não exige CMake do sistema: o `shiguredo_cmake` baixa o seu próprio, o que de
# quebra evita a incompatibilidade com CMake 4 que derrubou o `audiopus` em
# M0.4. Custa cerca de meio minuto por build limpo — o preço de as três
# plataformas se comportarem igual. Ver ADR 0008.
shiguredo_opus = { workspace = true, features = ["source-build"] }
# The codec reports libopus failures to the log rather than across an API:
# a C function name and an error code help a developer and tell a person nothing.
tracing = "0.1.44"
thiserror = "2.0.19"

# Só para ler o que o Windows já decidiu sobre o microfone — ver
# `device::consentimento_do_microfone`. Não acrescenta à árvore: já está no
# `Cargo.lock`, trazido pelo que o Tauri e o `cpal` carregam.
#
# Leitura e nada mais: este crate não escreve no registro, e não tem por que.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# A captura por processo: WASAPI cru, que o `cpal` não alcança. A mesma versão
# que `seele-video` já traz, para o `Cargo.lock` não carregar duas cópias do
# mundo do Windows.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-core = "0.62"

# **Folha própria, e a razão é uma linha só.**
#
# `unsafe_code` precisa ser `deny` em vez de `forbid`: a captura de áudio por
# processo do Windows é WASAPI cru — `ActivateAudioInterfaceAsync` e um objeto
# COM implementado à mão —, e o `cpal` não a alcança. `forbid` não se afrouxa nem
# com `allow` dentro de um módulo, que é o mecanismo com que `seele-video` (ADR
# 0041) e `seele-instalador` (ADR 0043) isolam a mesma necessidade.
#
# Todo o resto é **cópia** do `[workspace.lints]`, e cópia apodrece. Quem prende
# isso é `xtask/tests/folha_de_lints.rs`, que lê os dois arquivos e reprova
# qualquer divergência que não seja esta.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"

[dev-dependencies]
assert_no_alloc = "1.1.2"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "opus_frame"
harness = false

