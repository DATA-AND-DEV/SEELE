name: Dependências de sistema no Linux
description: >
  Os pacotes que o workspace precisa para compilar no Linux — ALSA para o cpal
  (specs/03-audio.md) e a pilha webkit2gtk para a casca Tauri
  (specs/06-clientes-gui.md).

  Existe como ação composta, e não copiado em cada job, porque a primeira
  versão do CI tinha essa lista em um job só. O `docs` e o `release` quebraram
  num cabeçalho ausente cuja mensagem não se parece nada com a causa. Uma lista
  em dois lugares é uma lista que diverge.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          pkg-config \
          libasound2-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev \
          libxdo-dev
