name: Release

# Dispara ao empurrar uma tag `v*`, ou manualmente pela aba Actions.
#
# O manual existe para que dê para provar o pipeline sem cortar uma versão —
# um workflow de release que só roda quando alguém já decidiu lançar é um
# workflow que estreia no pior momento possível.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a gravar nos instaladores — X.Y.Z, ou X.Y.Z-N com N só de dígitos"
        required: false
        # Era `0.0.0-dev`, e foi isso que quebrou o primeiro empacotamento:
        # o instalador do Windows não representa um pré-lançamento por extenso.
        # Ver a conferência no job `versao`.
        default: "0.0.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decide a versão uma vez, para que os três sistemas gravem a mesma coisa.
  versao:
    name: versão
    runs-on: ubuntu-24.04
    outputs:
      numero: ${{ steps.calcular.outputs.numero }}
      tag: ${{ steps.calcular.outputs.tag }}
    steps:
      - id: calcular
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            numero="${tag#v}"
          else
            numero="${{ inputs.versao }}"
            tag="v${numero}"
          fi
          # O empacotador de MSI recusa versões que o formato do instalador não
          # sabe representar — e recusa **depois** de seis minutos compilando, no
          # último dos três sistemas. Conferir aqui custa um segundo e falha
          # antes de qualquer build.
          #
          # As faixas são as do `ProductVersion` do MSI, e o pré-lançamento vira
          # um campo numérico: `0.1.0-rc1` não tem como caber ali. Foi o padrão
          # `0.0.0-dev` deste workflow que descobriu isso do jeito caro.
          if ! printf '%s' "${numero}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$'; then
            echo "::error::a versão «${numero}» não serve para o instalador do Windows."
            {
              echo "Aceito: X.Y.Z, ou X.Y.Z-N com N só de dígitos."
              echo "Não serve: -dev, -rc1, -beta.2, +metadados, ou o «v» na frente."
              echo "O MSI guarda o pré-lançamento num campo numérico; não há onde pôr letras."
            } >&2
            exit 1
          fi

          maior="${numero%%.*}"; resto="${numero#*.}"
          menor="${resto%%.*}"; resto="${resto#*.}"
          correcao="${resto%%-*}"
          pre=""
          case "${numero}" in *-*) pre="${numero##*-}" ;; esac

          if [ "${maior}" -gt 255 ] || [ "${menor}" -gt 255 ] || [ "${correcao}" -gt 65535 ]; then
            echo "::error::a versão «${numero}» estoura as faixas do MSI (maior e menor até 255, correção até 65535)."
            exit 1
          fi
          if [ -n "${pre}" ] && [ "${pre}" -gt 65535 ]; then
            echo "::error::o pré-lançamento «${pre}» passa de 65535, que é o teto do campo no MSI."
            exit 1
          fi

          echo "numero=${numero}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "versão ${numero}, tag ${tag} — cabe no MSI"

  empacotar:
    name: ${{ matrix.nome }}
    needs: versao
    runs-on: ${{ matrix.os }}
    strategy:
      # Um sistema quebrado não deve esconder o resultado dos outros dois.
      fail-fast: false
      matrix:
        include:
          # Um formato por sistema, de propósito. Uma página de release com
          # .deb, .AppImage, .msi, .exe e .dmg obriga quem chegou a escolher
          # antes de entender a diferença — e a primeira escolha de quem não
          # sabe é fechar a aba.
          #
          # `.deb` e não AppImage: é o único formato que instala `plug` e
          # `seeled` em `/usr/bin`, e o pedido era um arquivo que traga as duas
          # metades. Quem não usa Debian nem Ubuntu tem o instalador por `curl`
          # e o código-fonte.
          - os: ubuntu-24.04
            nome: linux
            bundles: deb
          # `.exe` do NSIS e não `.msi`: instala no perfil sem pedir
          # administrador, e o MSI é o que recusa versão com pré-lançamento.
          - os: windows-2022
            nome: windows
            bundles: nsis
          # `app,dmg` e não só `dmg`. O `.app` sempre foi construído — o `.dmg`
          # é uma imagem com ele dentro —, mas pedi-lo **por nome** é o que faz
          # o empacotador tratá-lo como alvo e produzir o `.app.tar.gz` que o
          # atualizador baixa. Sem isto o bundler emite «no updater-enabled
          # targets were built» e o macOS fica sendo o único sistema que não
          # atualiza sozinho. O `.app` solto não vai para o release: o passo de
          # reunir escolhe por extensão, e diretório não é arquivo.
          - os: macos-15
            nome: macos
            bundles: app,dmg

    steps:
      - uses: actions/checkout@v4

      - name: Dependências de sistema (Linux)
        if: matrix.nome == 'linux'
        uses: ./.github/actions/deps-linux

      # Um .dmg por Mac só serve se rodar nos dois. O runner é arm64, então o
      # alvo Intel entra explicitamente e os binários viram universais no fim.
      - name: Alvo Intel (macOS)
        if: matrix.nome == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.nome }}

      # A versão vive no tauri.conf.json, e é ela que aparece no instalador e no
      # "Sobre" do sistema. Gravada aqui para que o arquivo baixado não diga
      # 0.0.0 quando a tag diz outra coisa.
      #
      # E, junto com ela, **tudo o que depende de haver credencial**. Está tudo
      # neste passo de propósito: são três decisões da mesma forma — «existe o
      # segredo? então ligue; senão siga sem» — e espalhá-las por três lugares
      # faria com que descobrir por que um build saiu sem assinatura exigisse
      # ler três lugares. `docs/assinatura-e-atualizacao.md` é o passo a passo
      # de obter cada uma.
      #
      # Os segredos entram por `env` e não interpolados no corpo do Python: um
      # valor com aspas fecharia a string e o que viesse depois seria código.
      # Nenhum destes segredos é escolhido por quem abre um PR, mas a forma
      # certa custa o mesmo que a errada.
      - name: Gravar a versão e o que houver de credencial
        id: gravar
        shell: bash
        env:
          VERSAO: ${{ needs.versao.outputs.numero }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          caminho = pathlib.Path("apps/seele-app/tauri.conf.json")
          config = json.loads(caminho.read_text())
          config["version"] = os.environ["VERSAO"]

          def segredo(nome):
              return os.environ.get(nome, "").strip()

          # ------------------------------------------------------------ macOS
          #
          # O padrão no arquivo é `-`, que é assinatura ad-hoc. Não vale para o
          # Gatekeeper — só a notarização vale —, mas **é o que faz a permissão
          # de microfone grudar no macOS**: sem assinatura de bundle o sistema
          # não tem a que identidade prender a autorização e pergunta de novo a
          # cada vez, sem nunca lembrar.
          #
          # Escrito aqui em vez de confiar na precedência da variável de
          # ambiente, que eu não conferi. Explícito não tem precedência para
          # errar.
          identidade = segredo("APPLE_SIGNING_IDENTITY")
          if identidade:
              config["bundle"].setdefault("macOS", {})["signingIdentity"] = identidade

          # ---------------------------------------------------------- Windows
          #
          # Azure Artifact Signing — o nome novo do Trusted Signing. É o único
          # caminho barato para uma assinatura que o SmartScreen aceite: sem
          # token físico, sem HSM na mesa, na ordem de dez dólares por mês. A
          # assinatura acontece na nuvem e o certificado nunca sai de lá.
          #
          # As três partes juntas ou nenhuma: um `signCommand` com endereço e
          # sem conta falha **no fim do build**, depois de compilar tudo.
          endereco = segredo("AZURE_ENDPOINT")
          conta = segredo("AZURE_ARTIFACT_SIGNING_ACCOUNT")
          perfil = segredo("AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE")
          assina_windows = bool(endereco and conta and perfil)
          if assina_windows:
              # Forma de objeto, e não a string com espaços: uma conta ou um
              # perfil com espaço no nome viraria dois argumentos.
              #
              # `-d SEELE` é o nome que o Windows mostra no aviso de elevação.
              # Sem ele o instalador se apresenta como uma cadeia aleatória de
              # caracteres, que é pior do que não assinar.
              config["bundle"].setdefault("windows", {})["signCommand"] = {
                  "cmd": "artifact-signing-cli",
                  "args": ["-e", endereco, "-a", conta, "-c", perfil, "-d", "SEELE", "%1"],
              }
          elif endereco or conta or perfil:
              print("::warning::só parte da credencial do Windows está configurada; o instalador sai sem assinatura.")

          # ------------------------------------------------------ atualizador
          #
          # Outra assinatura, e é preciso não confundir: esta é **do projeto**,
          # e é o que faz o app recusar um pacote que não veio daqui. A do
          # sistema operacional, acima, é o que faz o sistema deixar abrir. Uma
          # não substitui a outra, e o canal de atualização é justamente onde
          # comprometer um produto é mais barato.
          #
          # As duas metades juntas ou nada: a pública vive no repositório, em
          # `plugins.updater.pubkey`, e a privada é segredo. Ligar os artefatos
          # de atualização com só uma delas é build que quebra no último passo,
          # ou — pior — release que sai com assinatura que nenhum app aceita.
          privada = segredo("TAURI_SIGNING_PRIVATE_KEY")
          publica = config.get("plugins", {}).get("updater", {}).get("pubkey", "").strip()
          atualizador = bool(privada and publica)
          if atualizador:
              config["bundle"]["createUpdaterArtifacts"] = True
          elif privada or publica:
              print("::warning::só metade da chave do atualizador existe; este release não atualiza ninguém.")

          caminho.write_text(json.dumps(config, indent=2, ensure_ascii=False) + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as saida:
              saida.write(f"assinar_windows={'sim' if assina_windows else 'nao'}\n")
              saida.write(f"atualizador={'sim' if atualizador else 'nao'}\n")

          print("versão gravada:", config["version"])
          print("assinatura macOS:", config["bundle"].get("macOS", {}).get("signingIdentity"))
          print("assinatura Windows:", "sim" if assina_windows else "não")
          print("artefatos de atualização:", "sim" if atualizador else "não")
          PY

      # ---------------------------------------------------------------- CLI
      #
      # `seeled` e `plug` são o que faz o teste entre duas máquinas não exigir
      # um compilador em cada uma delas. Vêm antes do app de propósito: são o
      # produto principal (`specs/00-visao-geral.md`) e o que menos pode falhar.

      - name: Compilar seeled e plug
        if: matrix.nome != 'macos'
        run: cargo build --release --bin seeled --bin plug

      - name: Compilar seeled e plug (universal, macOS)
        if: matrix.nome == 'macos'
        run: |
          cargo build --release --bin seeled --bin plug --target aarch64-apple-darwin
          cargo build --release --bin seeled --bin plug --target x86_64-apple-darwin
          mkdir -p target/release
          for binario in seeled plug; do
            lipo -create -output "target/release/${binario}" \
              "target/aarch64-apple-darwin/release/${binario}" \
              "target/x86_64-apple-darwin/release/${binario}"
            lipo -info "target/release/${binario}"
          done

      # Os dois entram **dentro** do instalador do app.
      #
      # Era isto que faltava: quem baixava o app ganhava só a metade gráfica, e
      # hospedar ou usar o terminal exigia baixar outro arquivo. Agora um
      # instalador traz as duas metades, que é o que "hospede você mesmo" quer
      # dizer na prática.
      #
      # O Tauri procura acompanhantes pelo nome com o alvo no fim, e no macOS
      # **universal ele quer os três nomes**: um por arquitetura, porque compila
      # duas vezes, e o `-universal-apple-darwin`, porque é o que ele copia para
      # dentro do bundle. Descoberto tentando aqui: com só o universal ele para
      # em "resource path binaries/plug-aarch64-apple-darwin doesn't exist", e
      # com só os dois por arquitetura ele compila e para na hora de empacotar.
      - name: Pôr seeled e plug junto do app
        shell: bash
        run: |
          set -eu
          mkdir -p apps/seele-app/binaries

          if [ "${{ matrix.nome }}" = "macos" ]; then
            for binario in plug seeled; do
              for alvo in aarch64-apple-darwin x86_64-apple-darwin; do
                cp "target/${alvo}/release/${binario}" \
                   "apps/seele-app/binaries/${binario}-${alvo}"
              done
              cp "target/release/${binario}" \
                 "apps/seele-app/binaries/${binario}-universal-apple-darwin"
            done
          else
            case "${{ matrix.nome }}" in
              windows) alvo="x86_64-pc-windows-msvc"; sufixo=".exe" ;;
              linux)   alvo="x86_64-unknown-linux-gnu"; sufixo="" ;;
            esac
            for binario in plug seeled; do
              cp "target/release/${binario}${sufixo}" \
                 "apps/seele-app/binaries/${binario}-${alvo}${sufixo}"
            done
          fi

          ls -la apps/seele-app/binaries

      # ---------------------------------------------------------------- app

      - name: Instalar a CLI do Tauri
        run: cargo install tauri-cli --version "^2" --locked

      # A ferramenta que assina no Windows, instalada só quando há credencial
      # para ela usar. Sem este `if` seriam dois minutos de compilação em todo
      # release para nada.
      #
      # Ela é uma casca em volta do `signtool` da Microsoft: pede um token ao
      # Azure com as três variáveis `AZURE_CLIENT_*` e chama o `signtool` com o
      # dispositor de assinatura da nuvem. Por isso precisa de três coisas que o
      # runner do Windows já traz — a CLI do Azure, o .NET 8 e o `signtool`, que
      # vem com o Windows SDK numa pasta cujo nome muda a cada versão.
      #
      # O caminho padrão da ferramenta fixa uma versão do SDK (`10.0.26100.0`),
      # e o runner não é obrigado a ter aquela. Procurar aqui é a diferença
      # entre um erro na terceira linha e um erro depois de vinte minutos de
      # compilação.
      - name: Preparar a assinatura do Windows
        if: matrix.nome == 'windows' && steps.gravar.outputs.assinar_windows == 'sim'
        shell: pwsh
        run: |
          cargo install artifact-signing-cli --locked
          $kits = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signtool = Get-ChildItem -Path $kits -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $signtool) {
            Write-Error "não achei o signtool.exe em $kits; a assinatura do Windows não teria como acontecer."
          }
          Write-Host "signtool: $signtool"
          "SIGNTOOL_PATH=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Assinatura e notarização da Apple, se houver credencial.
      #
      # Sem elas o Gatekeeper recusa abrir o app baixado — "não foi possível
      # verificar se contém malware" — e não há truque que resolva: exige uma
      # Developer ID paga. Os segredos entram vazios enquanto não existirem, o
      # Tauri ignora, e o `.dmg` sai sem assinar. As NOTAS-DE-RELEASE dizem o
      # que fazer nesse caso em vez de deixar a pessoa sozinha com o alerta.
      - name: Empacotar o app (macOS universal)
        if: matrix.nome == 'macos'
        working-directory: apps/seele-app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # A chave do projeto. Só é lida quando `createUpdaterArtifacts` está
          # ligado, e ele só liga quando esta chave e a pública existem — ver o
          # passo de gravar a versão. Vazia, este par de linhas não faz nada.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --config tauri.release.conf.json --target universal-apple-darwin --bundles ${{ matrix.bundles }}

      # O Windows recebe o `--config` dos acompanhantes; o Linux não, porque lá
      # os dois entram em `/usr/bin` pelo `deb.files` do `tauri.linux.conf.json`
      # — e receber os dois faria o `.deb` carregar os binários duas vezes.
      - name: Empacotar o app (Windows)
        if: matrix.nome == 'windows'
        working-directory: apps/seele-app
        env:
          # As três que a ferramenta de assinatura troca por um token no Azure.
          # Ela as lê do ambiente sozinha; não aparecem no `signCommand`, e é
          # bom que não apareçam — argumento de linha de comando é visível para
          # qualquer processo da máquina.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --config tauri.release.conf.json --bundles ${{ matrix.bundles }}

      - name: Empacotar o app (Linux)
        if: matrix.nome == 'linux'
        working-directory: apps/seele-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      # ------------------------------------------------------------- reunir

      - name: Reunir os arquivos
        shell: bash
        run: |
          set -eu
          versao="${{ needs.versao.outputs.numero }}"
          destino="entrega"
          mkdir -p "$destino"

          # O bundle do macOS universal sai noutra pasta.
          if [ "${{ matrix.nome }}" = "macos" ]; then
            raiz="target/universal-apple-darwin/release/bundle"
          else
            raiz="target/release/bundle"
          fi

          # Instaladores, seja qual for o formato que a plataforma produziu.
          find "$raiz" -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp {} "$destino/" \; 2>/dev/null || true

          instaladores=$(find "$destino" -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$instaladores" != "1" ]; then
            echo "::error::esperava exatamente um instalador e vieram ${instaladores}."
            echo "Um arquivo por sistema é o combinado; ver a matriz deste workflow." >&2
            ls -la "$destino" >&2
            exit 1
          fi

          # ---------------------------------------- o que o app baixa sozinho
          #
          # Só existe quando este release foi construído com a chave do projeto.
          # Sem ela o `entrega/` acaba aqui, e o release sai como sempre saiu:
          # um instalador por sistema, para baixar à mão.
          #
          # Estes arquivos **não** são para uma pessoa baixar. Eles são o que o
          # botão de atualizar dentro do app procura, e as NOTAS-DE-RELEASE
          # dizem isso para quem chegar na página e se perguntar o que são.
          if [ "${{ steps.gravar.outputs.atualizador }}" = "sim" ]; then
            if [ "${{ matrix.nome }}" = "macos" ]; then
              # O macOS atualiza a partir do `.app` compactado, e não do `.dmg`:
              # imagem de disco é coisa que uma pessoa monta e arrasta, e o
              # atualizador precisa de algo que ele saiba abrir e trocar de
              # lugar sozinho.
              #
              # Renomeado para carregar a versão. O empacotador o chama de
              # `SEELE.app.tar.gz`, sem número, e numa página de release isso é
              # um arquivo que não diz de que versão é. A assinatura vale sobre
              # os bytes, não sobre o nome, então renomear não a invalida.
              tarball=$(find "$raiz" -type f -name '*.app.tar.gz' | head -n 1)
              if [ -z "$tarball" ]; then
                echo "::error::o empacotador não deixou o .app.tar.gz que o atualizador baixa."
                echo "A matriz deste job pede \`app,dmg\` justamente para que ele exista." >&2
                exit 1
              fi
              cp "$tarball" "$destino/SEELE_${versao}_universal.app.tar.gz"
              cp "${tarball}.sig" "$destino/SEELE_${versao}_universal.app.tar.gz.sig"
            else
              # Windows e Linux atualizam pelo **próprio instalador** — o mesmo
              # `.exe` e o mesmo `.deb` que já estão sendo publicados. O que
              # falta é a assinatura ao lado deles.
              find "$raiz" -type f \( -name '*.exe.sig' -o -name '*.deb.sig' \) \
                -exec cp {} "$destino/" \; 2>/dev/null || true
            fi

            # A conferência que importa: um release que se anuncia como
            # atualizável e chega sem assinatura é um release que todo app vai
            # recusar em silêncio, depois de baixar. Melhor falhar aqui.
            assinaturas=$(find "$destino" -maxdepth 1 -type f -name '*.sig' | wc -l | tr -d ' ')
            if [ "$assinaturas" != "1" ]; then
              echo "::error::esperava uma assinatura de atualização e achei ${assinaturas}."
              echo "Ela sai do \`cargo tauri build\` com TAURI_SIGNING_PRIVATE_KEY no ambiente." >&2
              ls -la "$destino" >&2
              exit 1
            fi
          fi

          # O arquivo da CLI **não** é um segundo instalador: é o que o
          # `install.sh` e o `install.ps1` baixam. Sem ele o `curl | sh` que
          # existe justamente para quem não quer instalador nenhum para de
          # funcionar.
          if [ "${{ matrix.nome }}" = "windows" ]; then
            7z a "$destino/seele-cli-${versao}-windows-x86_64.zip" \
              ./target/release/seeled.exe ./target/release/plug.exe
          else
            tar -czf "$destino/seele-cli-${versao}-${{ matrix.nome }}.tar.gz" \
              -C target/release seeled plug
          fi

          echo "--- reunido ---"
          ls -la "$destino"

      - uses: actions/upload-artifact@v4
        with:
          name: entrega-${{ matrix.nome }}
          path: entrega/*
          if-no-files-found: error

  publicar:
    name: publicar
    needs: [versao, empacotar]
    runs-on: ubuntu-24.04
    # Declaradas no job, e não no topo do arquivo: só este publica, e só ele
    # precisa assinar. `id-token` é o que deixa o runner provar ao GitHub quem
    # ele é; `attestations` é o que deixa gravar o atestado no repositório.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: entrega
          merge-multiple: true

      # Procedência, e não segurança — a diferença importa e o instalador não a
      # explica.
      #
      # Nada aqui é assinado com certificado de código: o SmartScreen e o
      # Gatekeeper vão reclamar de qualquer forma, e as NOTAS-DE-RELEASE dizem o
      # que fazer. O que este passo resolve é outra pergunta, que a soma de
      # verificação sozinha **não** responde: o `SHA256SUMS` prova que o arquivo
      # baixado é o que esta página publicou, mas quem confere só ele ainda está
      # confiando em quem escreveu a página. O atestado é assinado pelo GitHub e
      # amarra cada arquivo ao commit e à execução que o produziu.
      #
      #   gh attestation verify SEELE_x.y.z_x64-setup.exe --repo DATA-AND-DEV/SEELE
      #
      # Roda **antes** do `SHA256SUMS` de propósito: neste ponto `entrega/` tem
      # exatamente os artefatos do build, e nada mais. Atestar o manifesto junto
      # seria atestar um arquivo que descreve os outros em vez dos outros.
      - name: Atestar a procedência
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: entrega/*

      # O manifesto que o botão de atualizar procura.
      #
      # Mora **no próprio release**, e não num servidor nosso: o endereço
      # gravado no app é
      #
      #   https://github.com/…/releases/latest/download/latest.json
      #
      # e `releases/latest` significa, para o GitHub, o último release
      # **publicado e não pré-lançamento**. Rascunho não entra. É a propriedade
      # que faz a decisão de lançar continuar sendo de uma pessoa: enquanto o
      # rascunho não for publicado à mão, nenhum app do mundo enxerga a versão
      # nova. Não há botão a apertar nem serviço a hospedar para isso valer.
      #
      # Gerado depois do atestado de propósito. Ele descreve os outros arquivos,
      # como o `SHA256SUMS` — atestar um manifesto seria atestar a descrição em
      # vez do que ela descreve. Antes das somas, para que elas o cubram.
      #
      # O mesmo script que `empacotar/` usa quando o release é montado à mão.
      # Não há segunda cópia da regra: um release feito sem CI que saísse sem
      # manifesto deixaria todo mundo sem atualização até o seguinte, e quem o
      # montou não teria como saber.
      - name: Manifesto de atualização
        run: python3 empacotar/manifesto.py entrega "${{ needs.versao.outputs.tag }}" --repo "$GITHUB_REPOSITORY"

      # As somas são o que torna o instalador por `curl` defensável: sem elas,
      # quem roda o script está confiando no canal, e não no conteúdo.
      - name: Somas de verificação
        working-directory: entrega
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Listar o que será publicado
        run: ls -la entrega

      # `gh` já vem no runner. Nada de action de terceiro aqui: um workflow que
      # cria releases é exatamente onde uma dependência a mais custa caro.
      #
      # Rascunho, não publicado. Quem decide que uma versão está pronta é uma
      # pessoa que baixou e abriu pelo menos um dos arquivos.
      - name: Criar o rascunho do release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ needs.versao.outputs.tag }}"

          # Apaga o **rascunho** anterior desta tag, se houver, e não a tag.
          # `--cleanup-tag` apagaria justamente a tag que disparou este
          # workflow, e o release seguinte nasceria apontando para o commit
          # padrão do repositório em vez do que foi marcado.
          #
          # Só rascunho, e isso é a diferença que importa. Reexecutar não deve
          # acumular rascunhos duplicados — era o que este trecho resolvia —,
          # mas um release **publicado** é decisão tomada por uma pessoa, e
          # apagá-lo aqui contradiz a linha escrita três abaixo. O caso concreto
          # não é hipotético: quando a cota de Actions acabou, os instaladores
          # foram montados à mão em duas máquinas e publicados pelo navegador.
          # Um disparo deste workflow na mesma tag varreria aquilo sem perguntar.
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release delete "$tag" --yes
            else
              echo "::error::já existe um release **publicado** em $tag, e este workflow não o apaga."
              {
                echo "Publique noutra versão, ou remova o release à mão se a intenção é mesmo substituí-lo."
                echo "Rascunhos são substituídos sem cerimônia; publicados, não."
              } >&2
              exit 1
            fi
          fi

          gh release create "$tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "SEELE $tag" \
            --notes-file .github/NOTAS-DE-RELEASE.md \
            entrega/*
          echo "rascunho criado. Revise e publique em Releases."
