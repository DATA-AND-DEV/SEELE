name: CI

# Runs on every push and every pull request. This is the workflow release.yml
# never was: `release.yml` only ever builds installers on a tag, and neither
# it nor anything else in this repository has ever run `cargo fmt`, `cargo
# clippy`, or `cargo test` automatically. In particular, no CI job has ever
# compiled this workspace for Windows outside of cutting an actual release —
# which means every `#[cfg(windows)]` block in `seele-audio` (device.rs) and
# all of `laco_por_processo.rs` (`#![cfg(windows)]` for the whole file) has
# never been type-checked, linted, or exercised by anything automatic. That
# blind spot is exactly where the reported "switching headphones/microphone on
# Windows" bug lives (docs/pendencias.md #31).
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting does not need a full build or platform-specific system
  # dependencies, so it runs once instead of once per OS.
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.name }})
    strategy:
      # One platform failing must not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-2022
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ALSA and the webkit2gtk stack the workspace needs to compile
      # apps/seele-app on Linux (same action release.yml uses, so the
      # dependency list has exactly one home).
      - name: System dependencies (Linux)
        if: matrix.name == 'linux'
        uses: ./.github/actions/deps-linux

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-clippy-${{ matrix.name }}

      # `--all-targets` reaches tests, examples and benches too — including
      # laco_por_processo.rs, which has no unit tests of its own and would
      # otherwise never be looked at by anything except a Windows release
      # build.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-2022
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (Linux)
        if: matrix.name == 'linux'
        uses: ./.github/actions/deps-linux

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-test-${{ matrix.name }}

      # seele-audio's device tests look for a real microphone/speaker and skip
      # loudly (`eprintln!("skipped ...")`) when the machine has none — see
      # crates/seele-audio/src/device.rs. GitHub-hosted runners have no audio
      # hardware on either OS, so those skips are expected here and are not
      # masking a bug: the point of this job is to prove the `#[cfg(windows)]`
      # paths still *compile and link*, which every run of this step already
      # does for the whole workspace, hardware or not.
      - name: cargo test (workspace)
        # One command. The separate `cargo test -p seele-conformance --
        # --test-threads=1` step, and the `--exclude seele-conformance` it
        # forced on the step above it, were both removed on 2026-09-16.
        #
        # They existed because of docs/pendencias.md #29: every test in
        # seele-conformance brings up a real QUIC server — handshake, TLS,
        # database — `libtest` runs them in parallel inside the binary, and
        # under load the concurrent handshakes blew the transport's 20s
        # IDLE_TIMEOUT. One conformance test failed per round, a different one
        # each time.
        #
        # The serialization now lives inside the crate itself, as an RAII
        # permit (crates/seele-conformance/tests/vaga/mod.rs) that each test
        # holds for its whole duration. That makes the separate step redundant,
        # and better than redundant: the permit reaches *only* this crate,
        # while `--test-threads=1` in a step of its own also forced excluding
        # the crate from the other step — two commands where the project has
        # one, and no guarantee at all for whoever ran `cargo test --workspace`
        # on their own machine.
        #
        # Measured before removing it (#29, closing entry): five consecutive
        # rounds of this exact command under 12 deliberate CPU burners on a
        # 15-core machine, all exit 0, 1883 tests each, wall times within 0.9s
        # of each other. The permit costs +76s per round and it buys back a
        # suite that is evidence again.
        run: cargo test --workspace --all-targets
