name: CI

# **Só pela aba Actions**, e isto é uma escolha de quem opera, não um esquecimento.
#
# Ela roda o que este repositório nunca rodou automaticamente: `cargo fmt`,
# `cargo clippy` e `cargo test` nos três sistemas. Em particular, nenhum job
# jamais compilou este workspace para Windows fora de cortar um lançamento — o
# que quer dizer que todo bloco `#[cfg(windows)]` de `seele-audio` (device.rs) e
# todo o `laco_por_processo.rs` (`#![cfg(windows)]` no arquivo inteiro) nunca foi
# checado, lintado nem exercitado por nada automático. É exatamente onde vive o
# defeito relatado de «trocar de fone/microfone no Windows»
# (docs/pendencias.md #31).
#
# # O que custa ser manual
#
# Um push não é conferido por ninguém até alguém pedir. O portão que **não** se
# mexeu é o do `release.yml`: publicar por ele continua exigindo `validar` verde
# nos três sistemas sobre o mesmo SHA, que é o R07 da revisão da v15. A exceção
# é a saída `sem_validar` do `release.yml`, que pula o `validar` inteiro e fica
# no registro do run. O `validar` roda o que este arquivo roda — formatação,
# regras, clippy, testes e as bancadas de MOD de `node` puro —, menos as
# bancadas de navegador. Quer dizer que, nisso, o esquecimento aqui não chega
# ao que sai pelo `release.yml`: ele chega ao tempo que se leva para descobrir,
# e isso está dito porque é o preço real.
#
# O `empacotar/publicar.sh` publica por fora do `validar`, com a bateria dele.
# Ela roda, entre outras coisas, formatação, clippy, testes e as mesmas
# bancadas de MOD de `node` puro, e o `--sem-bateria` pula tudo isso, dizendo
# que pulou: no terminal de quem publica e no corpo do release.
#
# **As bancadas de navegador são a exceção nos dois caminhos.** Elas só rodam
# aqui, no job `bancadas` (e a do executor de MODs no navegador, que precisa do
# `.wasm`, no `bancadas-de-mod`), e uma release pode sair com uma delas
# vermelha se ninguém disparar este workflow antes. Quem diz quais são é o
# teste `toda_bancada_da_pasta_roda_em_algum_lugar`
# (`xtask/src/check_runtime.rs`): toda bancada da pasta está num `run:` de um
# daqueles dois jobs ou na lista das de Node puro, e a que não está reprova o
# teste.
#
# Voltar ao automático é devolver as duas linhas:
#
#     on:
#       push:
#       pull_request:
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting does not need a full build or platform-specific system
  # dependencies, so it runs once instead of once per OS.
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check

  # As três conferências de regra do repositório, rodadas contra a **árvore de
  # verdade**.
  #
  # Elas existem desde sempre e nenhuma CI as rodava: os testes que vivem dentro
  # de `xtask` são sobre fixtures — eles provam que a lógica sabe reprovar uma
  # aresta inventada, e não que esta árvore passa. A verificação real só
  # acontecia quando alguém lembrava de digitar o comando, que é o «existir não
  # é funcionar» do CLAUDE.md com três anos de idade.
  #
  # Num job próprio e leve: as três leem arquivos e não compilam o produto.
  regras:
    name: regras do repositório
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # A fachada da API de MOD (ADR 0045): todo nome de `api/` ainda aponta
      # para alguma coisa.
      - run: cargo xtask check-api
      # A regra de dependência de specs/01-arquitetura.md.
      - run: cargo xtask check-deps
      # E que a versão do produto alcance tudo o que a carrega. Ver
      # `xtask/src/check_versao.rs` para o que já ficou para trás sem isto.
      - run: cargo xtask check-versao

  clippy:
    name: clippy (${{ matrix.name }})
    strategy:
      # One platform failing must not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-2022
            name: windows
          # **macOS, e é a lacuna que o R07 nomeia.** Esta matriz tinha dois
          # sistemas e o produto anuncia três: o Mac só era compilado quando
          # alguém já havia decidido lançar, no `release.yml`, onde nada
          # reprovava. Todo o `captura/macos.rs` e o caminho de
          # `SCStream` nunca foram vistos por nada automático.
          #
          # **`macos-26`, e não `macos-15`: é o SDK que decide.** O
          # `apple-metal` 0.8.8, que o `screencapturekit` arrasta, compila
          # Swift no `build.rs` e usa símbolos do macOS 26 dentro de
          # `if #available(macOS 26.0, *)`. O `#available` é conferido quando
          # roda, e o símbolo tem de existir quando compila: com o SDK do
          # macOS 15 o build script reprovava, e **nenhum** lint e nenhum
          # teste rodava no Mac (execução 43264412497, 12/11/2026). O rótulo
          # `macos-26` é a imagem arm64 do macOS 26, lido do README do
          # `actions/runner-images` nesse mesmo dia; o que **não** foi medido
          # é este workflow nela — a primeira execução é a prova. Os dois
          # jobs do `release.yml` (`validar` e `empacotar`) usam o mesmo
          # rótulo, pelo mesmo motivo.
          - os: macos-26
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ALSA and the webkit2gtk stack the workspace needs to compile
      # apps/seele-app on Linux (same action release.yml uses, so the
      # dependency list has exactly one home).
      - name: System dependencies (Linux)
        if: matrix.name == 'linux'
        uses: ./.github/actions/deps-linux

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-clippy-${{ matrix.name }}

      # `--all-targets` reaches tests, examples and benches too — including
      # laco_por_processo.rs, which has no unit tests of its own and would
      # otherwise never be looked at by anything except a Windows release
      # build.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          # O DTLS do `seele-enlace` compila o AWS-LC (`aws-lc-sys`, ADR 0063,
          # emenda do RUSTSEC-2026-0387). Nenhum passo de instalação a mais,
          # de propósito: o MSVC do runner compila o C, o NASM é dispensado
          # pelos objetos pré-montados (`prebuilt-nasm`, que o `dimpl` liga) e
          # o CMake não entra (o `aws-lc-sys` 0.46 usa o `cc` com as ligações
          # pré-geradas). Este job e o de clippy são a prova disso no Windows.
          - os: windows-2022
            name: windows
          # Pelo mesmo motivo da matriz de clippy acima: três sistemas
          # anunciados, três sistemas testados. E no mesmo runner dela, pelo
          # SDK (ver lá).
          - os: macos-26
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (Linux)
        if: matrix.name == 'linux'
        uses: ./.github/actions/deps-linux

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-test-${{ matrix.name }}

      # seele-audio's device tests look for a real microphone/speaker and skip
      # loudly (`eprintln!("skipped ...")`) when the machine has none — see
      # crates/seele-audio/src/device.rs. GitHub-hosted runners have no audio
      # hardware on either OS, so those skips are expected here and are not
      # masking a bug: the point of this job is to prove the `#[cfg(windows)]`
      # paths still *compile and link*, which every run of this step already
      # does for the whole workspace, hardware or not.
      # **O vigia do Linux.** Em 13/11/2026 o `test (linux)` morreu duas vezes
      # seguidas aos ~54 min com «the hosted runner lost communication with
      # the server» (execuções 43355895287 e 43370570352; a rodada boa leva 38
      # min). Quando o runner morre o log do passo se perde inteiro, e não se
      # soube qual teste o levou. O vigia anota a memória e os três maiores
      # processos a cada 20 s e, antes de a máquina sufocar, mata o maior
      # binário de teste e diz qual foi: o passo reprova, e o log fica.
      - name: vigia de memória (Linux)
        if: matrix.name == 'linux'
        run: |
          cat > "$RUNNER_TEMP/vigia.sh" <<'VIGIA'
          while sleep 20; do
            livre=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
            maiores=$(ps -eo rss,etimes,args --sort=-rss | awk 'NR>1 && NR<5 {printf "%d MiB %ds %s | ", $1/1024, $2, substr($0, index($0,$3), 110)}')
            echo "$(date -u +%T) livre=${livre}MiB carga=$(cut -d" " -f1 /proc/loadavg) :: $maiores"
            if [ "$livre" -lt 700 ]; then
              alvo=$(ps -eo pid,rss,args --sort=-rss | awk '/target\/debug\/deps/ {print $1; exit}')
              echo "VIGIA: memória livre em ${livre} MiB; matando o maior binário de teste (pid ${alvo:-nenhum})"
              [ -n "$alvo" ] && kill -KILL "$alvo"
            fi
          done
          VIGIA
          nohup sh "$RUNNER_TEMP/vigia.sh" > "$RUNNER_TEMP/vigia.log" 2>&1 &
      - name: cargo test (workspace)
        # One command. The separate `cargo test -p seele-conformance --
        # --test-threads=1` step, and the `--exclude seele-conformance` it
        # forced on the step above it, were both removed on 2026-09-16.
        #
        # They existed because of docs/pendencias.md #29: every test in
        # seele-conformance brings up a real QUIC server — handshake, TLS,
        # database — `libtest` runs them in parallel inside the binary, and
        # under load the concurrent handshakes blew the transport's 20s
        # IDLE_TIMEOUT. One conformance test failed per round, a different one
        # each time.
        #
        # The serialization now lives inside the crate itself, as an RAII
        # permit (crates/seele-conformance/tests/vaga/mod.rs) that each test
        # holds for its whole duration. That makes the separate step redundant,
        # and better than redundant: the permit reaches *only* this crate,
        # while `--test-threads=1` in a step of its own also forced excluding
        # the crate from the other step — two commands where the project has
        # one, and no guarantee at all for whoever ran `cargo test --workspace`
        # on their own machine.
        #
        # Measured before removing it (#29, closing entry): five consecutive
        # rounds of `cargo test --workspace` under 8 deliberate CPU burners on
        # a 15-core machine, all exit 0, 1883 tests each, zero FAILED lines,
        # wall times spread over 1.4s (259.76s to 261.18s). Note the measured
        # command lacked the `--all-targets` this step passes; on this tree the
        # two select overlapping but *different* work — see the note below on
        # doctests, added after the claim was measured and found false. The cost
        # per round is in
        # #29's closing entry and is deliberately not copied here — copying a
        # measured number into a second place is how this file ended up quoting
        # figures that had already been retired.
        #
        # The `--all-targets` this step used to pass was dropped on 2026-09-17,
        # and the sentence above claiming it selected the same work was wrong.
        # `--all-targets` does not run doctests, and `-- --list` does not
        # enumerate them, so the check that was cited could not have shown it.
        # Measured: `cargo test --workspace --all-targets` prints 0 `Doc-tests`
        # sections and `cargo test --workspace` prints 8. This job had never run
        # a single doctest. What `--all-targets` did add over the plain command
        # is the bench in seele-audio and the examples — and the clippy job
        # above already passes `--all-targets --all-features`, so both are still
        # compiled on every push. Nothing was lost. The gain is small and the
        # number is here so nobody quotes it bigger: those 8 sections hold one
        # real doctest (seele-proto::version::negotiate) and 7 empty ones. What
        # was fixed is the false claim and the gap in the command, not a
        # coverage hole.
        #
        # Not all of it: a sixth armed round under the same load failed, in
        # moderacao::um_operador_modera_pessoas_e_nao_o_comandante, the set
        # ending at 21.28s on `Error: SemResposta` — while the same set alone
        # under the same load passes in 1.4s, 4 times out of 4. #29 is heavily
        # reduced, not eliminated: 1 failure in 6 armed rounds against roughly
        # 2 in 3 before. See #29's closing entry; do not cite the five without
        # the sixth.
        #
        # What proves the permit is acting, in those same five rounds: the
        # acceptance_m5 binary closes at 22.96-23.06s with 15/15. That is the
        # *serial* figure measured on 2026-08-31 (23.02s), not the parallel one
        # (~20.01s, flush against the 20s IDLE_TIMEOUT).
        #
        # What those five rounds do *not* prove, stated here so nobody cites
        # them for more than they are: a CPU burner on its own does not
        # reproduce #29 — disarmed rounds under that load also came out 0. The
        # load that does reproduce it adds six loops running conformance
        # binaries *outside* cargo, and under that load, disarmed, the failure
        # comes straight back: --workspace, exit 101, the conformance set
        # ending at 20.32s on `Error: SemResposta`. So the five rounds prove no
        # regression, the cost and that the permit acts; the reversal cycle is
        # what proves it holds under the load that caused the failure. Both
        # live in docs/evidencias/pendencia-29/arquivo-entregue/.
        #
        # **E o teste de áudio local é pulado.**
        #
        # `laco::testes::a_saida_desta_maquina_abre_como_entrada` abre a saída
        # desta máquina como entrada, e um runner sem placa de som não tem o que
        # abrir: ele não reprova, ele **não termina**. A revisão da v15 registra
        # a execução interrompida depois do aviso de 60 s — e uma suíte que
        # pendura é uma suíte que alguém passa a ignorar.
        #
        # Por nome e não por categoria: a lista fica curta e visível, e o próximo
        # teste que precise de hardware terá de ser nomeado aqui — que é a
        # conversa certa a ter, em vez de um filtro largo engolindo os seguintes
        # em silêncio.
        #
        # **Com `--no-fail-fast`.** Sem ele o cargo para no primeiro binário de
        # teste vermelho, e os que viriam depois não ficam nem verdes nem
        # vermelhos: em 12/11/2026 (execução 43264412497) o Linux parou no
        # `seele-audio`, por um runner sem placa de som, e o Windows no
        # `reserva` do `seele-conformance` — de tudo o que vinha depois, nos
        # dois, não se soube nada. O passo continua vermelho com um vermelho
        # só; o que muda é que ele diz todos.
        if: matrix.name != 'linux'
        run: cargo test --workspace --no-fail-fast -- --skip a_saida_desta_maquina_abre_como_entrada
        # O passo bom leva de 25 a 45 min; um teste pendurado não segura a
        # máquina até ela cair.
        timeout-minutes: 60
      # **No Linux a saída vai para um arquivo, com prazo.** O runner morreu
      # três vezes aos 54 min cravados (13/11), com o vigia de memória ligado
      # na terceira e sem ele ter o que dizer: o log do passo se perde junto.
      # Os testes bons acabam em 27 min. Aqui o cargo tem 40; vencidos, o passo
      # reprova **vivo** e mostra onde parou, o tamanho da saída e as linhas
      # que mais se repetem (uma enxurrada de log é a suspeita que sobra).
      - name: cargo test (workspace, Linux)
        if: matrix.name == 'linux'
        timeout-minutes: 50
        run: |
          saida=0
          timeout -k 30 40m cargo test --workspace --no-fail-fast -- --skip a_saida_desta_maquina_abre_como_entrada > "$RUNNER_TEMP/testes.log" 2>&1 || saida=$?
          echo "saída do cargo: $saida (124 é o prazo de 40 min)"
          ls -la "$RUNNER_TEMP/testes.log"; df -h "$RUNNER_TEMP" | tail -1
          echo "--- binários e resultados"
          grep -aE "^ +Running |^test result|^test .* FAILED|^error" "$RUNNER_TEMP/testes.log" | cut -c1-200 | tail -400
          echo "--- as falhas, com o que disseram"
          grep -aE -B12 "^test .* FAILED" "$RUNNER_TEMP/testes.log" | cut -c1-400 | tail -200
          if [ "$saida" -ne 0 ]; then
            echo "--- as 15 linhas que mais se repetem"
            cut -c1-120 "$RUNNER_TEMP/testes.log" | sort | uniq -c | sort -rn | head -15
            echo "--- o fim da saída"
            tail -c 6000 "$RUNNER_TEMP/testes.log"
          fi
          exit "$saida"
      - name: o que o vigia viu (Linux)
        if: ${{ always() && matrix.name == 'linux' }}
        run: |
          grep VIGIA "$RUNNER_TEMP/vigia.log" || echo "o vigia não matou nada"
          echo "--- os 15 momentos de menor memória livre"
          sort -t= -k2 -n "$RUNNER_TEMP/vigia.log" | grep -v VIGIA | head -15
          echo "--- o fim"
          tail -8 "$RUNNER_TEMP/vigia.log"

  # As bancadas de navegador, que nada automático rodava.
  #
  # # Por que elas precisam de um job
  #
  # R07 da revisão da v15: «o CI não executa as bancadas de navegador». Elas
  # exercitam o HTML e os scripts de verdade, num Chromium de verdade — é onde os
  # defeitos de interface desta revisão foram reproduzidos —, e viviam só na
  # memória de quem lembrasse de digitar o comando.
  #
  # E havia a segunda metade, pior: cada bancada resolvia o Playwright com um
  # caminho absoluto para `node_modules` de **outro repositório na máquina de uma
  # pessoa**. Num checkout limpo todas morriam com `MODULE_NOT_FOUND`. O recuo
  # saiu — ver `bancada/playwright.cjs` — e é este job que prova que ele saiu.
  bancadas:
    name: bancadas de navegador
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `--no-save` porque este repositório não tem `package.json` e não vai
      # ganhar um por causa disto: a dependência é de teste, de um job, e
      # declarar um manifesto npm na raiz de um workspace Rust convida a uma
      # segunda árvore de dependências que ninguém pediu.
      #
      # **A versão é fixa** (31/10/2026): com a mais nova a cada rodada, o
      # navegador muda debaixo das bancadas. A 1.64 (Chromium 156, WebKit 27.2)
      # aceita o `WebAssembly.Module` na porta do worklet, que a
      # `voz-no-navegador.cjs` usa para provocar o `messageerror`, e o WebKit
      # 27.2 desenha diferente a captura redimensionada da
      # `compartilhar-pessoal-web.cjs`; as duas passam na 1.62.1. Subir a
      # versão é uma decisão com a rodada inteira medida, e não um efeito do dia.
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      # Cada bancada por nome, e não um laço sobre a pasta. Uma bancada nova tem
      # de ser acrescentada aqui de propósito: um laço que rodasse tudo passaria
      # a reprovar a CI no dia em que alguém guardasse um rascunho ali, e a
      # resposta a isso seria tirar o laço.
      #
      # **E esquecê-la é vermelho.** O teste
      # `toda_bancada_da_pasta_roda_em_algum_lugar`, em
      # `xtask/src/check_runtime.rs`, exige que todo `.cjs` de `bancada/` —
      # fora o `playwright.cjs` e o `telas.cjs`, que não são bancada — esteja
      # num `run:` deste job, na lista das de Node puro, ou na lista de
      # exceções dele, que é vazia. É ele que conta quantas são, e não um
      # comentário.
      #
      # **Cada passo roda mesmo depois de uma vermelha, e tem prazo.** No
      # Actions um passo que falha pula os seguintes, e um passo pulado não fica
      # nem verde nem vermelho: até 01/10/2026 a `ajustes-v013.cjs` ficava
      # vermelha e pulava as duas que vinham depois dela em todo disparo. Com
      # `!cancelled()`, uma bancada vermelha é só ela vermelha; com o prazo, uma
      # que pendura não segura o job até o teto de 360 minutos. Cada uma leva
      # segundos (de 0 a 5 s, medido no macOS em 01/10/2026). O teste
      # `todo_passo_de_bancada_do_job_de_navegador_roda_depois_de_uma_vermelha_e_tem_prazo`,
      # no mesmo `check_runtime.rs`, exige os dois em todo passo de bancada.
      # O que a casca chama sozinha no navegador, com a ponte de verdade e sem
      # duble (F4, Tarefa 3.1): nada volta recusado, nas duas cascas.
      - run: node apps/seele-app/bancada/ponte-sem-gesto.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/compartilhar-por-identidade.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/conversa-com-estado.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/qualidade-da-voz.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/avatares-do-mod.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/diagnostico-de-mods.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # **Estas três não rodaram em lugar nenhum até 01/10/2026.** Entraram em
      # 21/09/2026 (`ajustes-v013.cjs` e `gif-na-conversa.cjs` em `970cb67`,
      # `escolha-de-versao-de-mod.cjs` em `0018e71`), e nenhum workflow nem a
      # bateria do `empacotar/publicar.sh` as nomeava (`git log -S` com o nome
      # de cada uma). Rodadas, a `ajustes-v013.cjs` saía vermelha pela bancada,
      # e não pelo produto: ela escrevia o retrato de antes de `14d9c30`
      # (`snapshot.tela = { e_minha: true }`), e o produto pergunta por
      # `snapshot.minha_transmissao` (ADR 0054). Com o retrato que o produto lê,
      # as três saem com 0 (medido com o Playwright local em 01/10/2026).
      - run: node apps/seele-app/bancada/ajustes-v013.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/escolha-de-versao-de-mod.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/gif-na-conversa.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # As prévias de imagem da conversa têm teto (11/11/2026, a varredura do
      # incidente da capa em 4K): os dois mapas que as guardam só cresciam até
      # o fim da sessão. O bolso despeja e diz o que recolheu, a recusa por
      # pixels tem frase, e despejar uma imagem de link não a busca de novo.
      - run: node apps/seele-app/bancada/teto-das-previas.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # O texto da sessão sob um tema claro, pelo contraste que o navegador
      # computa (09/10/2026): a cor resolvida acima de `#tela-sessao` deixava o
      # corpo das mensagens a 1,09:1 com um tema que a validação aceitava.
      - run: node apps/seele-app/bancada/tema-claro-legivel.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # As regiões da API 6 no `index.html` real (tarefa 5 da F3): o nó de um MOD
      # aparece no contêiner da região, o que é do produto continua lá, e
      # revogar devolve a região ao que era.
      - run: node apps/seele-app/bancada/regioes-do-produto.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # A capa de uma pessoa (tarefa 6 da F3): o cartão pintado, o texto por
      # cima, o quadro estático com movimento reduzido e a recusa dita.
      - run: node apps/seele-app/bancada/capa.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # Sem capa, a cor do perfil no lugar dela (0.19): o texto por cima fica
      # a 4,5:1 nas oito cores, no ponto mais claro do degradê.
      - run: node apps/seele-app/bancada/cor-do-perfil.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # As camadas da API 6 (tarefa 7 da F3): a folha que empilha três, com a
      # saída e o `descartou` do produto, o painel recusado na 6, e os tetos
      # das superfícies pelo nome.
      - run: node apps/seele-app/bancada/camadas.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # As saídas de quem hospeda com um MOD de API antiga (o corte da API 6;
      # tarefa 13 da F3, Step 5b): as três na ordem do dono, ATUALIZAR só com a
      # versão da 6 no catálogo, a saída no servidor que recusou, e a 0.15 pela
      # tela das versões.
      - run: node apps/seele-app/bancada/saidas-de-quem-hospeda.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # O link do navegador na porta de quem hospeda (D-web-6), com o aviso de
      # quem entra por ele (D-web-7, saída C): nos quatro alcances, e sem sumir
      # quando só o ponto de encontro alcança.
      - run: node apps/seele-app/bancada/link-do-navegador.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # O núcleo de confiança no desktop (tarefa 9 da F3): o MUDO, o fone, o
      # SAIR, o «no ar» e o veredito nas cores do produto, sob qualquer tema.
      - run: node apps/seele-app/bancada/nucleo.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # O codificador de vídeo em uso no rodapé da sessão: o nome que o retrato
      # traz, à vista só durante a transmissão própria, e como texto.
      - run: node apps/seele-app/bancada/codificador-no-rodape.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # O tema do servidor na casca (tarefa 17d da F3): chega pelo retrato e é
      # aplicado antes de desenhar a sessão, e o None o tira.
      - run: node apps/seele-app/bancada/tema-do-servidor.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # A escolha de quem pinta o servidor (tarefa 17f.0 da F3): com dois MODs
      # de tema ligados, a gestão pergunta qual, marca o que pinta e avisa no
      # SALVAR.
      - run: node apps/seele-app/bancada/gestao-do-tema.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # O palco dos MODs sobre a chamada (tarefa 7, Step 5, da F3): monta
      # sobre a grade, que continua no DOM; a saída é do produto e não
      # desmonta; sair da sala desmonta, mesmo com a conversa à frente.
      - run: node apps/seele-app/bancada/palco-da-chamada.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # Um redesenho por quadro (pendência 63): 251 eventos num quadro pedem um
      # retrato só, e 251 pessoas com um cartão de MOD em cada, sob 251 eventos
      # por segundo, não deixam fila. A M3 de 10/10 travou a página sem isto.
      - run: node apps/seele-app/bancada/um-redesenho-por-quadro.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # A lista de pessoas reconciliada pelo id (pendência 63, (b)): um
      # PersonState mexe só na linha da pessoa, e o foco fica; o mesmo retrato
      # não mexe em nada; quem entra numa sala leva o nó. A lista repovoada a
      # cada quadro sumia e voltava na árvore de acessibilidade. E a coluna de
      # canais (pendência 64): o foco do teclado num canal atravessa o tique.
      # E o resto da 63 (lote R63): o contador, a telemetria e o #voz-estado,
      # as regiões de MOD e a conversa não refazem o que não mudou.
      - run: node apps/seele-app/bancada/linhas-pelo-id.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # As bancadas da 0.17 que só precisam da casca (`ui/`) num Chromium, com a
      # ponte do Tauri simulada pela `telas.cjs`: hospedar o servidor legado
      # versus atualizar o MOD, o servidor hospedado versus a sessão de
      # participação, a portaria, os cargos, a queda que volta sozinha e o
      # isolamento entre sessões. Inscritas em 25/10/2026, quando o
      # `toda_bancada_da_pasta_roda_em_algum_lugar` achou 33 sem lugar.
      - run: node apps/seele-app/bancada/atualizar-mod-sem-servidor.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/aviso-antes-de-atualizar.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/copia-antes-de-converter.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/hospedar-com-servidor-no-ar.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/espera-e-carregando.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/diagnostico-0151.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/estado-por-sessao.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/palco-na-troca-de-vista.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/isolamento-das-sessoes.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/saida-hospedagem-navegacao.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/multi-sessao-na-ponte.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/vista-pessoal-0-17.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/vista-pessoal-0-17.cjs --janela=1600x919
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/vista-pessoal-0-17.cjs --janela=1280x720
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/palco-depois-de-reconectar.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/ciclo-de-reconectar-o-servidor.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/queda-que-volta-sozinha.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/portaria-por-identidade.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/recuperar-a-chave.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/tela-sem-captura-no-navegador.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/vista-da-entrada-pela-identidade.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/cargos.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # O crédito de recepção, sem `.wasm` e sem servidor: só o Chromium e o
      # Playwright que o `npm install` de cima pôs em `node_modules`.
      - run: node apps/seele-app/bancada/credito-no-navegador.cjs chromium playwright
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # A volta pela casca inteira (E2 da 0.17): um retrato por tela, e reprova
      # num erro de página. Os retratos vão para a pasta temporária do runner.
      - run: node apps/seele-app/bancada/navegacao-0-17.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 10
      # **Os roteiros da casca** (lote RT da F5), que até 10/10/2026 só rodavam
      # na bateria da orquestradora. Nem este workflow nem a bateria do
      # `empacotar/publicar.sh` os rodavam, e assim eles apodreciam calados: o
      # `aceite-de-mods.js` ficou três semanas sem provar nada (lote W3).
      #
      # Cada um pela `tools/carga-da-casca.py`, que carrega a casca de verdade
      # num `chrome-headless-shell`, com um duble do Tauri, e reprova num erro de
      # JS que ninguém pegou, num `exigir` do roteiro ou num roteiro que não
      # chega ao fim. A carga **não usa o Playwright**: ela procura o navegador
      # no cache dele, que é o que o `npx playwright install --with-deps
      # chromium` de cima enche, e o Python é o do runner.
      #
      # Todos numa chamada, e por nome: a carga roda todos mesmo depois de um
      # vermelho, e o fim diz qual roteiro reprovou e com que frase. Por nome, e
      # não um laço sobre a pasta, pela razão das bancadas acima; e esquecer um
      # é vermelho: o teste `todo_roteiro_da_pasta_roda_no_ci_e_no_publicar`, em
      # `xtask/src/check_runtime.rs`, exige cada arquivo da pasta nesta chamada
      # e na da bateria do `publicar.sh`. Juntos, levaram 9 s no macOS
      # (10/10/2026).
      - name: os roteiros da casca
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: >-
          python3 tools/carga-da-casca.py
          --roteiro tools/roteiros/abertura-com-entrar.js
          --roteiro tools/roteiros/abrir-versao-que-falha.js
          --roteiro tools/roteiros/aceite-de-mods-em-corrida.js
          --roteiro tools/roteiros/aceite-de-mods-que-falha.js
          --roteiro tools/roteiros/aceite-de-mods-que-nao-abre.js
          --roteiro tools/roteiros/aceite-de-mods.js
          --roteiro tools/roteiros/apagar-canal-recusado.js
          --roteiro tools/roteiros/apelido-no-hello.js
          --roteiro tools/roteiros/apelido-recusado.js
          --roteiro tools/roteiros/apps-mais-novos.js
          --roteiro tools/roteiros/atualizacao.js
          --roteiro tools/roteiros/avatar-na-chamada.js
          --roteiro tools/roteiros/banco-do-futuro.js
          --roteiro tools/roteiros/barra-mac.js
          --roteiro tools/roteiros/botoes-da-entrada.js
          --roteiro tools/roteiros/catalogo-de-mods.js
          --roteiro tools/roteiros/chamar.js
          --roteiro tools/roteiros/clique-nos-glifos.js
          --roteiro tools/roteiros/compartilhar.js
          --roteiro tools/roteiros/dispositivos.js
          --roteiro tools/roteiros/escolher-transmissao.js
          --roteiro tools/roteiros/etapa-da-tentativa.js
          --roteiro tools/roteiros/fechar.js
          --roteiro tools/roteiros/fora-do-ar.js
          --roteiro tools/roteiros/hospedar.js
          --roteiro tools/roteiros/icone-do-server.js
          --roteiro tools/roteiros/icone-na-trilha.js
          --roteiro tools/roteiros/ligar.js
          --roteiro tools/roteiros/ligar-na-sessao.js
          --roteiro tools/roteiros/medidas.js
          --roteiro tools/roteiros/meu-servidor.js
          --roteiro tools/roteiros/nome-ao-hospedar.js
          --roteiro tools/roteiros/outra-linha.js
          --roteiro tools/roteiros/outra-linha-pelo-launcher.js
          --roteiro tools/roteiros/palco.js
          --roteiro tools/roteiros/pedido-recusado.js
          --roteiro tools/roteiros/perfil-entrada.js
          --roteiro tools/roteiros/perfil-salva-sessao.js
          --roteiro tools/roteiros/perfil-salva.js
          --roteiro tools/roteiros/perfil-sessao.js
          --roteiro tools/roteiros/recusa-apagada.js
          --roteiro tools/roteiros/recusa-sem-dono.js
          --roteiro tools/roteiros/renomear-canal.js
          --roteiro tools/roteiros/rodape-do-operador.js
          --roteiro tools/roteiros/sair-da-sala.js
          --roteiro tools/roteiros/sala.js
          --roteiro tools/roteiros/sessao.js
          --roteiro tools/roteiros/tela-de-outra-versao.js
          --roteiro tools/roteiros/tetos-dos-campos.js
          --roteiro tools/roteiros/toque.js
          --roteiro tools/roteiros/trocar-de-janela.js
          --roteiro tools/roteiros/versao-ao-hospedar.js
          --roteiro tools/roteiros/versao-do-servidor.js
      # A bancada do celular (F8; D-api-8): a casca desenhada no Chromium e no
      # WebKit, a 390 × 844 e a 360 × 800, e o desktop igual pixel a pixel sem a
      # marca do celular. Ela não rodava em lugar nenhum. É Python, com o
      # Playwright e o Pillow dele, e o Python do runner é gerenciado pelo
      # sistema (PEP 668, recusa o `pip install`): por isso o do
      # `setup-python`, e no fim do job, para não trocar o Python dos roteiros.
      # O teste `toda_bancada_de_navegador_e_a_do_celular_rodam_no_ci_e_no_publicar`
      # exige este passo aqui e na bateria do `publicar.sh`.
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"
      - run: python3 -m pip install playwright pillow
        if: ${{ !cancelled() }}
      - run: python3 -m playwright install --with-deps chromium webkit
        if: ${{ !cancelled() }}
      # Ela é lenta: 561 s num Mac M-series em 15/10/2026, contra uns 74 das
      # outras 18 somadas. O prazo é três vezes isso, para um runner mais lento.
      - run: python3 tools/bancada-do-celular.py "$RUNNER_TEMP/bancada-do-celular"
        id: bancada-do-celular
        if: ${{ !cancelled() }}
        timeout-minutes: 30
      # **As fotos de uma bancada do celular vermelha sobem como artefato.** A
      # pasta fica na temporária do runner, que some no fim do job: em
      # 12/11/2026 (execução 43264412497) o G3 disse «o desktop mudou em
      # (1308, 8, 1399, 15)» e as duas fotos que ele comparou não existiam mais
      # para ninguém olhar. Só quando ela reprova (ou estoura o prazo): verde,
      # as fotos não dizem nada que o registro já não diga. O caminho é
      # `runner.temp`, e não `$RUNNER_TEMP`: o `path` de uma ação não passa por
      # shell. O teste `a_bancada_do_celular_vermelha_sobe_as_fotos`, em
      # `xtask/tests/empacotamento.rs`, exige este passo e a mesma pasta.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.bancada-do-celular.outcome == 'failure' }}
        with:
          name: bancada-do-celular
          path: ${{ runner.temp }}/bancada-do-celular
          retention-days: 7
          if-no-files-found: warn
      # A área útil da 0.17 (`area-util.cjs`): cada tela na superfície inteira, no desktop e no celular de verdade (a largura real
      # de cada tela e não só a da raiz, a rolagem própria, o foco preso das camadas, o teclado simulado sobre campos de texto,
      # o aviso do endereço novo). Com `--webkit`, UMA execução mede os DOIS motores (area-util.cjs, `motores`): o Chromium que o
      # job já instalou e o WebKit, o motor do Safari e do PWA do iPhone, instalado no passo logo antes (o `install` exato de
      # cima é o que `o_passo_dos_roteiros_…` procura, e fica como está). A pasta é `target/area-util`, relativa à raiz, e não o
      # `$RUNNER_TEMP`: a bateria do `publicar.sh` roda o MESMO comando, letra por letra
      # (`toda_bancada_de_navegador_e_a_do_celular_rodam_no_ci_e_no_publicar`). Leva ~10 min nos dois motores (medido no Mac em
      # 27/10); o prazo é três vezes isso. As capturas e o `medidas.json` sobem como artefato, vermelhos ou não.
      - run: npx playwright install --with-deps webkit
        if: ${{ !cancelled() }}
        timeout-minutes: 10
      - run: node apps/seele-app/bancada/pos-release-ui.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/desktop-estreito.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/mesa-de-texto.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/camera.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/transmissao-que-cai.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/previas-de-tela.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/apoio-na-ajuda.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/teste-de-conexao.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/instalavel.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/conversa-longa.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # A notificação do sistema na página de navegador, com a ponte de verdade e
      # um `Notification` de mentira: a opção nasce desligada, a permissão é
      # pedida dentro do clique, a recusa do navegador fica dita, e a menção e o
      # toque notificam só com a página fora da frente.
      - run: node apps/seele-app/bancada/notificacao-do-sistema.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/hotfix-0195.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/proporcao-tela-cheia.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # Plataformas dos MODs (API 8): nos dois motores, por isso depois do
      # `install webkit` de cima.
      - run: node apps/seele-app/bancada/plataformas-dos-mods.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # O túnel de jogo, do lado de quem joga (API 8, parte 2): o bilhete de gesto
      # na fronteira da casca (casos 2 a 4), o fecho no descarregar e a faixa do
      # produto. Nos dois motores, por isso também depois do `install webkit`.
      - run: node apps/seele-app/bancada/tunel-de-jogador.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # O aceite da máquina (API 8, parte 3): a tela do produto, o aviso da conta,
      # os termos que a pessoa marca, e o DESLIGAR.
      - run: node apps/seele-app/bancada/aceite-da-maquina.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # Quem hospeda volta sozinho depois de salvar o conjunto de MODs (e2e de
      # 31/10, passo 1): a queda `ModsMudaram` com o próprio sim já guardado.
      - run: node apps/seele-app/bancada/volta-depois-de-salvar-o-conjunto.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/visual-0174.cjs target/visual-0174
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/mods-nav-0174.cjs target/mods-nav-0174
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/visual-0174.cjs target/visual-0174-extras --extras
        if: ${{ !cancelled() }}
        timeout-minutes: 10
      - run: node apps/seele-app/bancada/hospedagem-config-0174.cjs target/hospedagem-config-0174
        if: ${{ !cancelled() }}
        timeout-minutes: 10
      - run: node apps/seele-app/bancada/area-util.cjs target/area-util --webkit
        if: ${{ !cancelled() }}
        timeout-minutes: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: area-util
          path: target/area-util
          retention-days: 7

  # As bancadas de MOD que não precisam de navegador: rodam no `node` puro, com
  # o código de verdade num contexto de VM e o resto de mentira, e guardam as
  # recusas que o seele.log passou a contar (plano de 2026-09-29, fase M1), o
  # ciclo de vida do executor, a fila de pedidos de MOD e a ponte das imagens
  # por volume. Fora daqui elas existiam e não rodavam — o «existir não é
  # funcionar» do CLAUDE.md.
  #
  # # Por que um job próprio
  #
  # Elas moravam no fim do job acima, depois da instalação do Chromium e das
  # bancadas de navegador. No Actions um passo que falha pula os
  # seguintes, e uma instalação do Playwright que quebrasse as deixava como
  # «skipped» — nem verdes nem vermelhas. Aqui elas não dependem de nada disso.
  #
  # # Uma lista só
  #
  # Os nomes moram em `xtask/src/check_runtime.rs`, e este job chama
  # `cargo xtask check-runtime`, como o `validar` do `release.yml` e a bateria
  # do `empacotar/publicar.sh`. Eram três listas escritas à mão — a deste job,
  # a do `validar` e a do `check_runtime.rs`, que ninguém chamava e tinha
  # quatro das seis —, e uma bancada nova entraria numa e não nas outras. Por
  # isso o job precisa de Rust, como o das regras, e de um cache de compilação,
  # como o clippy e os testes: a mesma ação, com uma chave só dele
  # (`ci-bancadas-de-mod`), porque ele compila o `xtask` e nada mais.
  bancadas-de-mod:
    name: bancadas de MOD (node puro)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-bancadas-de-mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # O `xtask` compila num passo à parte para o prazo de baixo medir as
      # bancadas, e não a instalação do toolchain fixado nem a compilação.
      - run: cargo build --quiet --package xtask
      # **Com prazo.** Uma bancada que pendura de verdade — um temporizador
      # vivo, um laço — não chega nem ao `exit` nem ao `beforeExit`, e o passo
      # seguraria o job até o teto, 360 minutos. A lista leva segundos.
      - name: as bancadas
        timeout-minutes: 5
        run: cargo xtask check-runtime
      # Os crates do celular dentro do `.wasm` (ADR 0057, e a emenda de
      # 08/10/2026): os bytes-ouro da linha 1 pela fronteira do `seele-web`, e o
      # motor de MODs do `seele-motor-web` com as importações fixas, o laço
      # cortado e o teto de memória, que só se prova no `wasm32-wasip1`. O
      # wasi-sdk vem conferido pelo `cargo xtask wasi-sdk`, com o hash fixado de
      # `x86_64-linux`; sem ele, o build do motor para em vez de baixar.
      #
      # Com `!cancelled()`, como os passos de baixo: uma bancada de Node
      # vermelha acima não pode pular o motor nem a bancada que o lê.
      - run: rustup target add wasm32-unknown-unknown wasm32-wasip1
        if: ${{ !cancelled() }}
      - name: os crates do celular no wasm
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo xtask web
      # O executor de MODs no navegador (ADR 0057), num Chromium e com o motor
      # que o passo acima acabou de compilar. O isolamento (nem a rede, nem a
      # origem da página, nem um armazenamento que sobreviva) só se prova num
      # navegador de verdade, e o `.wasm` só existe neste job: por isso esta
      # bancada de navegador mora aqui, e não no `bancadas`. O teste
      # `a_bancada_do_executor_no_navegador_roda_depois_do_motor_compilado`, em
      # `xtask/src/check_runtime.rs`, segura a ordem e o caminho.
      # A mesma versão fixa do job `bancadas` (ver o motivo lá).
      - run: npm install --no-save playwright@1.62.1
        if: ${{ !cancelled() }}
      - run: npx playwright install --with-deps chromium webkit
        if: ${{ !cancelled() }}
      - run: node apps/seele-app/bancada/executor-no-navegador.cjs target/wasm32-wasip1/release/seele_motor_web.wasm
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # A voz no navegador (Tarefa 3.3 da F4), com o `.wasm` do `seele-web` que
      # o mesmo passo compilou: o microfone falso do Chromium passa pelo
      # portão, pelo codec e por um laço local, e toca pela mistura do worklet.
      # O mesmo teste de ordem segura esta.
      - run: node apps/seele-app/bancada/voz-no-navegador.cjs target/wasm32-unknown-unknown/release/seele_web.wasm
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # A recepção que a página mede (protocolo 13), com o mesmo `.wasm`: um
      # laço local joga fora um datagrama em cada dez, e a perda e o jitter
      # contados nos buffers de jitter do worklet têm de chegar à página, com
      # o relato saindo uma vez por segundo. O mesmo teste de ordem segura esta.
      - run: node apps/seele-app/bancada/recepcao-no-navegador.cjs target/wasm32-unknown-unknown/release/seele_web.wasm
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # A identidade do navegador (Tarefa 3.4 da F4): o link lido pelo `.wasm` com
      # a `prova` que o mesmo passo compilou, e o token da tentativa contra um
      # servidor de mentira. O mesmo teste de ordem segura esta.
      - run: node apps/seele-app/bancada/identidade-no-navegador.cjs target/wasm32-unknown-unknown/release/seele_web.wasm
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # A sessão pelo navegador de ponta a ponta (Tarefa 2.6 da F4): a página
      # inteira entra pela WebTransport num servidor de verdade (o `Daemon`, pelo
      # exemplo `servidor_da_bancada`), conversa, a voz atravessa entre duas
      # páginas, e um MOD exigido sobe no executor com o motor que o
      # `cargo xtask web` compilou. O mesmo teste de ordem segura esta.
      - run: cargo build --quiet --package seele-server --example servidor_da_bancada
        if: ${{ !cancelled() }}
      - run: node apps/seele-app/bancada/sessao-no-navegador.cjs target/wasm32-unknown-unknown/release/seele_web.wasm target/debug/examples/servidor_da_bancada target/wasm32-wasip1/release/seele_motor_web.wasm
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # As bancadas da 0.17 que usam o `.wasm` e o `servidor_da_bancada` do
      # passo acima, no Chromium: os cargos pela tela e no navegador, o que
      # fica para trás, as três sessões na mesma página e a vista com dois
      # servidores (que lê também o motor de MODs). Só o Chromium é instalado
      # aqui, por isso `chromium` e não `webkit`.
      - run: node apps/seele-app/bancada/cargos-pela-tela.cjs target/wasm32-unknown-unknown/release/seele_web.wasm target/debug/examples/servidor_da_bancada
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/cargos-no-navegador.cjs target/wasm32-unknown-unknown/release/seele_web.wasm target/debug/examples/servidor_da_bancada chromium playwright
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/ficou-para-tras-no-navegador.cjs target/wasm32-unknown-unknown/release/seele_web.wasm target/debug/examples/servidor_da_bancada chromium playwright
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/tres-sessoes-no-navegador.cjs target/wasm32-unknown-unknown/release/seele_web.wasm target/debug/examples/servidor_da_bancada chromium playwright
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/vista-com-dois-servidores.cjs target/wasm32-unknown-unknown/release/seele_web.wasm target/debug/examples/servidor_da_bancada target/wasm32-wasip1/release/seele_motor_web.wasm chromium playwright
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # A portaria pelo navegador decide com a `portaria-da-bancada`, uma
      # ferramenta que faz o papel do app sem a casca. O fonte dela mora em
      # `apps/seele-app/bancada/medidas/portaria-2026-10-24/` (`.rs.txt`) e é
      # compilado FORA do workspace: o passo monta um crate numa pasta
      # temporária, com o `seele-server` por caminho, e o compila no `target/`
      # daqui, de onde sai `target/debug/portaria-da-bancada`. Esse crate tem
      # o próprio `Cargo.lock` (o `serde_json` não é fixado pelo do workspace).
      #
      # **O manifesto é o do `empacotar/publicar.sh`, letra por letra**, com a
      # raiz daqui (`$GITHUB_WORKSPACE`) no lugar da de lá (`$RAIZ`). Até
      # 12/11/2026 este passo escrevia a palavra `PLACEHOLDER` no `Cargo.toml`,
      # o cargo recusava o arquivo, e a `portaria-no-navegador.cjs` ia junto,
      # sem binário (execução 43264412497). O teste
      # `o_ci_e_o_publicar_escrevem_o_mesmo_manifesto_da_portaria`, em
      # `xtask/tests/empacotamento.rs`, compara os dois.
      - name: a portaria-da-bancada
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          pasta="$RUNNER_TEMP/portaria-da-bancada"
          mkdir -p "$pasta/src"
          cp apps/seele-app/bancada/medidas/portaria-2026-10-24/portaria-da-bancada.main.rs.txt "$pasta/src/main.rs"
          printf '[package]\nname = "portaria-da-bancada"\nversion = "0.0.0"\nedition = "2021"\npublish = false\n\n[workspace]\n\n[dependencies]\nseele-server = { path = "%s/crates/seele-server" }\nserde_json = "1"\n' "$GITHUB_WORKSPACE" > "$pasta/Cargo.toml"
          cargo build --quiet --manifest-path "$pasta/Cargo.toml" --target-dir target
      - run: node apps/seele-app/bancada/portaria-no-navegador.cjs target/wasm32-unknown-unknown/release/seele_web.wasm target/debug/examples/servidor_da_bancada target/wasm32-wasip1/release/seele_motor_web.wasm target/debug/portaria-da-bancada chromium playwright
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # O enlace WebRTC da página (`ui/rtc-web.js`) contra o enlace de produto
      # (`crates/seele-enlace/examples/eco.rs`) e contra o `seele-encontro`, no
      # Chromium. O eco e o ponto de encontro são compilados aqui mesmo.
      - run: cargo build --quiet --package seele-enlace --example eco
        if: ${{ !cancelled() }}
      - run: cargo build --quiet --package seele-encontro
        if: ${{ !cancelled() }}
      # A sala pessoal de verdade, para a página entrar nela pelo código
      # (`sala-pelo-codigo.cjs`, ADR 0068).
      - run: cargo build --quiet --package seele-server --example sala_da_bancada
        if: ${{ !cancelled() }}
      - run: cargo test --package xtask pacote_web::tests
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: cargo xtask pacote-web
        if: ${{ !cancelled() }}
        timeout-minutes: 15
      - run: node apps/seele-app/bancada/entrada-celular-sem-marca.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/entrada-prazos.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/entrada-simples.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/link-na-aba-aberta.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/sessao-flush-pendente.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/tags.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/pacote-web-cache.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/pacote-web-carregamento.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # Conversas por link e regressões de interface em Chromium/WebKit.
      #
      # **Neste runner, a perna em que duas páginas se ligam não roda no WebKit**,
      # em três bancadas: `chamada-web.cjs`, `pessoal-web-integrada.cjs` e
      # `pessoal-codigo-web.cjs`. No WebKit de Linux o candidato de host sai com
      # nome mDNS (`<uuid>.local`), e o nome de uma página não vira endereço na
      # outra: nenhum par se forma e o ICE fica em `new` (medido na execução
      # 43313171939; o `diagnostico-rtc.cjs` conta). Cada uma escreve
      # `PULADO: …` na saída, com o que ficou de fora; a perna roda no macOS, na
      # bateria do `publicar.sh`. `SEELE_EXIGE_DUAS_PAGINAS_NO_WEBKIT` a traz de
      # volta aqui, para medir de novo.
      - run: node apps/seele-app/bancada/chamada-web.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # O `.wasm` da página é argumento obrigatório dela (sem ele a bancada
      # morria com «uso:» antes de abrir o navegador).
      - run: node apps/seele-app/bancada/compartilhar-pessoal-web.cjs target/pacote-web/seele_web.wasm
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/entrada-dos-mods.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/icone-das-sessoes.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/pessoal-web.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/pessoal-web-layout-0181.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/pessoal-web-entrada.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/pessoal-web-integrada.cjs
        env:
          SEELE_CHAMADA_WASM: target/pacote-web/seele_web.wasm
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/pessoal-codigo-web.cjs
        env:
          SEELE_CHAMADA_WASM: target/pacote-web/seele_web.wasm
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/chamada-web-recepcao.cjs
        env:
          SEELE_CHAMADA_WASM: target/pacote-web/seele_web.wasm
        if: ${{ !cancelled() }}
        timeout-minutes: 2
      - run: node apps/seele-app/bancada/rtc-chamada-web.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/sessao-campainha.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # A saída de som da conversa pessoal com os dispositivos simulados, que
      # nenhum lugar chamava (`toda_bancada_da_pasta_roda_em_algum_lugar`).
      - run: node apps/seele-app/bancada/saida-pessoal-web.cjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/rtc-eco.cjs target/debug/examples/eco chromium playwright
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/rtc-credito.cjs target/debug/examples/eco chromium playwright
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/rtc-sinal.cjs target/debug/seele-encontro target/debug/examples/eco target/wasm32-unknown-unknown/release/seele_web.wasm chromium playwright
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node apps/seele-app/bancada/sala-pelo-codigo.cjs target/debug/seele-encontro target/debug/examples/sala_da_bancada target/wasm32-unknown-unknown/release/seele_web.wasm
        if: ${{ !cancelled() }}
        timeout-minutes: 5

  # O `cargo deny` sobre o `deny.toml`, que nenhum job daqui rodava.
  #
  # # Por que aqui também
  #
  # Ele estava neste arquivo até `1974d07`, quando o `ci.yml` inteiro saiu, e
  # o arquivo voltou sem ele. Desde então o único lugar que o roda é a bateria
  # do `empacotar/publicar.sh` — licenças e avisos de segurança —, e o
  # `--sem-bateria` pula a bateria inteira. Um aviso novo numa dependência
  # chegava pela pergunta de alguém, e não por um job vermelho: foi o caso do
  # `rtrb` 0.3.4 (RUSTSEC-2026-0274), achado em 03/09/2026.
  #
  # As quatro conferências, e não só as duas da bateria: `bans` e `sources`
  # também estão escritas no `deny.toml`, e ninguém as rodava. Em 05/10/2026,
  # com o banco de avisos local de 01/10, as quatro passavam
  # (`cargo deny --offline check advisories licenses bans sources`).
  #
  # A ferramenta é instalada no runner, como o `playwright` do job de
  # navegador: é ferramenta de CI, e nada dela entra num `Cargo.toml` nem no
  # `Cargo.lock`. O teste `o_ci_roda_deny_e_fuzz`, em
  # `xtask/tests/empacotamento.rs`, exige este passo.
  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-deny
      - run: cargo install cargo-deny --locked
      - run: cargo deny check advisories licenses bans sources

  # O fuzz dos analisadores de `seele-proto`, curto, a partir das sementes.
  #
  # # Por que ele existe
  #
  # A `specs/08-seguranca.md` pede fuzz dos analisadores que recebem bytes da
  # rede. Os alvos de `fuzz/` existem desde o primeiro commit, e nenhum
  # workflow os rodou nunca. Este job roda cada um por um minuto: não é a
  # campanha longa que acha o defeito raro, é o que impede um analisador novo
  # de entrar em pânico com a primeira entrada torta sem ninguém ver.
  #
  # # Como cada passo roda
  #
  # A pasta de corpus vem **antes** da das sementes. O libFuzzer grava o que
  # acha na primeira pasta que recebe (medido: 2 sementes viraram 658 arquivos
  # em seis segundos), e `fuzz/sementes/` é versionada e conferida byte a byte
  # por `crates/seele-proto/tests/sementes_do_fuzz.rs`. O `-create_missing_dirs=1`
  # cria a pasta de corpus, que o runner não tem; sem ele o libFuzzer recusa a
  # pasta que não existe.
  #
  # No nightly, porque o `cargo fuzz` precisa dele para o sanitizador, e o
  # nightly pode quebrar sem aviso: um vermelho aqui pode ser do compilador, e
  # o log diz qual dos dois.
  #
  # O `fuzz/Cargo.lock` é conferido antes do primeiro alvo. O `cargo fuzz run`
  # não aceita `--locked`, e sem ele o cargo reescreve um lock atrasado no
  # runner, onde ninguém o comita. O que o histórico mostra: o `serde_json`
  # entrou no `seele-proto` em `f4e3183` (05/09); o lock, que não é do
  # workspace, ficou como estava desde `8df5da6` (09/08) até o `1277d85`
  # (08/10), em que um `cargo fuzz build` o reescreveu; e este job nasceu em
  # `62e3f7e` (05/10) já sem `--locked`, dizendo que o lock estava atrás. Não se
  # mediu se o job rodou, nem com que resultado, entre 05/10 e 08/10. Quem
  # aceita `--locked` é o `cargo metadata`, e ele reprova se o lock precisa
  # mudar. O conserto é local e sem rede: `cp Cargo.lock fuzz/Cargo.lock`,
  # `cargo metadata --offline --manifest-path fuzz/Cargo.toml --format-version 1
  # > /dev/null`, e comitar o lock. A cópia vem antes porque o `metadata`
  # sozinho resolve o que falta na versão mais nova que achar: em 12/11/2026,
  # quando este passo reprovou pelo `dimpl` com `aws-lc-rs` do `seele-enlace`,
  # ele pôs o `aws-lc-sys` 0.47.0, e o produto sai com o 0.46.0. Partindo do lock
  # do workspace, o cargo mantém as versões do produto e tira o que o fuzz não
  # usa. Os testes `o_lock_do_fuzz_lista_o_que_os_crates_da_casa_declaram` e
  # `o_lock_do_fuzz_resolve_como_o_do_workspace` dizem o que dá para dizer
  # antes do push, só com os arquivos; um recurso novo que só acrescenta uma
  # dependência a um pacote é este passo que pega.
  #
  # Cada alvo por nome, e cada passo roda mesmo depois de um vermelho, como as
  # bancadas: um alvo que entra em pânico não esconde os outros. O teste
  # `o_ci_roda_deny_e_fuzz`, em `xtask/tests/empacotamento.rs`, exige um passo
  # para cada `[[bin]]` de `fuzz/Cargo.toml`, e o
  # `todo_alvo_do_fuzz_tem_sementes`, no `seele-proto`, que cada um tenha
  # sementes.
  #
  # O `crash-*` que o libFuzzer grava em `fuzz/artifacts/` sobe como artefato
  # quando algum passo falha: o runner some no fim do job, e sem isso quem vê o
  # vermelho fica com o nome do alvo e sem a entrada que o derrubou. O último
  # passo, porque `failure()` só vale para o que já rodou.
  fuzz-curto:
    name: fuzz curto
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
      - run: cargo +nightly fuzz run control_frame fuzz/corpus/control_frame fuzz/sementes/control_frame -- -max_total_time=60 -create_missing_dirs=1
        if: ${{ !cancelled() }}
        timeout-minutes: 15
      - run: cargo +nightly fuzz run media_header fuzz/corpus/media_header fuzz/sementes/media_header -- -max_total_time=60 -create_missing_dirs=1
        if: ${{ !cancelled() }}
        timeout-minutes: 15
      - run: cargo +nightly fuzz run version_negotiation fuzz/corpus/version_negotiation fuzz/sementes/version_negotiation -- -max_total_time=60 -create_missing_dirs=1
        if: ${{ !cancelled() }}
        timeout-minutes: 15
      - run: cargo +nightly fuzz run uri fuzz/corpus/uri fuzz/sementes/uri -- -max_total_time=60 -create_missing_dirs=1
        if: ${{ !cancelled() }}
        timeout-minutes: 15
      - run: cargo +nightly fuzz run datagrama_do_encontro fuzz/corpus/datagrama_do_encontro fuzz/sementes/datagrama_do_encontro -- -max_total_time=60 -create_missing_dirs=1
        if: ${{ !cancelled() }}
        timeout-minutes: 15
      - run: cargo +nightly fuzz run sinal_do_encontro fuzz/corpus/sinal_do_encontro fuzz/sementes/sinal_do_encontro -- -max_total_time=60 -create_missing_dirs=1
        if: ${{ !cancelled() }}
        timeout-minutes: 15
      - run: cargo +nightly fuzz run envelope fuzz/corpus/envelope fuzz/sementes/envelope -- -max_total_time=60 -create_missing_dirs=1
        if: ${{ !cancelled() }}
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: warn
