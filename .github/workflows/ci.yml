name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Compilação incremental produz artefatos que nunca serão reaproveitados numa
  # máquina descartável, e custa tempo e disco para isso.
  CARGO_INCREMENTAL: 0
  # Informação de depuração completa é boa parte do tempo de ligação, sobretudo
  # no Windows, onde gerar PDB é caro. `line-tables-only` guarda arquivo e linha
  # — que é o que um `panic!` de teste precisa — e joga fora o resto.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Formatting is platform independent, so it runs once rather than three times.
  # specs/10-convencoes.md: "default rustfmt, no custom configuration.
  # Discussing formatting is wasted time."
  # Formatação e lint num sistema só, e o motivo é medido: `cargo clippy` roda
  # com um `RUSTC_WRAPPER` diferente, o que muda a impressão digital de **toda**
  # a árvore de dependências. Rodar `build` e depois `clippy` compila umas
  # quinhentas caixas duas vezes; fazer isso nos três sistemas compila seis.
  #
  # Lint é quase todo independente de plataforma. O que se perde é lintar os
  # trechos sob `cfg(windows)`, que hoje são a dependência do Opus e uma função
  # de escrita de arquivo. Barato perto de metade do tempo da esteira.
  lint:
    name: fmt e clippy
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deps-linux
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # specs/09-roadmap.md, M0 acceptance: cargo build and cargo test green on all
  # three operating systems.
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # specs/10-convencoes.md: main is always green and always runnable. Scoped
    # to this job rather than to the whole workflow: as a top-level `env` it
    # also reached `cargo install`, compiling third-party tools like cargo-deny
    # with `-D warnings` and failing the build on somebody else's warning.
    env:
      RUSTFLAGS: -D warnings
      # **Onde há módulo publicado, faltar é falha e não licença para pular.**
      #
      # Sem isto os testes de codec voltavam cedo e contavam como passados, e
      # ninguém distinguia «rodou» de «pulou» num relatório verde. Foi assim que
      # o `ida_e_volta` ficou verde por anos enquanto **falhava** com o módulo
      # que o próprio produto baixa. No Linux o Cisco não publica nada e a
      # variável não tem efeito — a checagem pergunta isso ao código.
      SEELE_EXIGE_CODEC: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux }
          - { os: macos-15, name: macos }
          - { os: windows-2022, name: windows }
    steps:
      - uses: actions/checkout@v4

      - name: Dependências de sistema
        if: matrix.name == 'linux'
        uses: ./.github/actions/deps-linux

      - uses: Swatinem/rust-cache@v2

      # O módulo do Cisco, que o produto não pode distribuir mas o CI pode
      # buscar. Sem ele metade dos testes de tela não roda, e não rodar tem a
      # mesma cor de passar.
      #
      # As URLs saem de `seele-video/src/modulo.rs`, e são copiadas aqui porque
      # `xtask` não conhece aquele crate — criar a dependência para uma linha
      # mexeria na regra que o próprio `check-deps` guarda. A cópia é presa por
      # `crates/seele-video/tests/modulo_publicado.rs`, que lê este arquivo.
      #
      # Descomprimido por Python e não por `bunzip2`: os três runners têm
      # Python, e o Windows não tem `bunzip2`.
      - name: Módulo de vídeo (macOS)
        if: matrix.name == 'macos'
        shell: bash
        run: |
          curl -sSLo /tmp/modulo.bz2 https://ciscobinary.openh264.org/libopenh264-2.6.0-mac-arm64.dylib.bz2
          python3 -c "import bz2,pathlib; pathlib.Path('$HOME/libopenh264.dylib').write_bytes(bz2.decompress(pathlib.Path('/tmp/modulo.bz2').read_bytes()))"
          echo "SEELE_OPENH264=$HOME/libopenh264.dylib" >> "$GITHUB_ENV"

      - name: Módulo de vídeo (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          curl -sSLo /tmp/modulo.bz2 https://ciscobinary.openh264.org/openh264-2.6.0-win64.dll.bz2
          python -c "import bz2,pathlib; pathlib.Path(r'$USERPROFILE\\openh264.dll').write_bytes(bz2.decompress(pathlib.Path('/tmp/modulo.bz2').read_bytes()))"
          echo "SEELE_OPENH264=$USERPROFILE\openh264.dll" >> "$GITHUB_ENV"

      # Uma passada só. `cargo test` compila as bibliotecas, os binários e os
      # testes — inclusive a casca Tauri, que é onde a falta do `icon.ico`
      # apareceu. O `cargo build` que existia antes daqui refazia esse mesmo
      # trabalho para nada.
      - name: Build e teste
        run: cargo test --workspace

      # specs/01-arquitetura.md: "this boundary is the most important contract in
      # the project". A contract checked only by review is a contract that erodes.
      - name: Dependency rule
        run: cargo xtask check-deps

  # specs/08-seguranca.md: cargo deny and cargo audit fail the build on a known
  # vulnerability.
  supply-chain:
    name: supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo-deny
        run: cargo deny --all-features check
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo-audit
        run: cargo audit

  # specs/08-seguranca.md: "Fuzzing of the seele-proto parsers — it is the surface
  # that receives untrusted network bytes."
  #
  # A short smoke run on every push proves the harness still builds and runs; it
  # is not a real fuzzing campaign. Long campaigns belong on a schedule or on a
  # developer's machine, with the corpus kept between runs.
  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Smoke run
        run: cargo +nightly fuzz run version_negotiation -- -max_total_time=60

  # specs/10-convencoes.md: cargo doc on the whole public API. Broken intra-doc
  # links are the usual way documentation rots without anyone noticing.
  docs:
    name: docs
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      # `cargo doc --workspace` compila tudo, inclusive a casca Tauri.
      - uses: ./.github/actions/deps-linux
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --document-private-items
