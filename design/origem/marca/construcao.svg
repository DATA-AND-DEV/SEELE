<!-- SEELE · painel de construção do símbolo. Referência, não arte: nada aqui é
     servido nem entra em build. A arte é `design/marca/simbolo.svg`.

     A grade é de 4 em 4 numa caixa de 96, que é a unidade em que traço e
     respiro são escritos. O quadro tracejado é a área de respiro — um nó cheio,
     24 — e ele encosta nos dois nós de propósito: é assim que se confere se a
     marca está solta demais ou apertada demais num suporte novo.

     As medidas em números estão no README ao lado. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" role="img" aria-label="SEELE — painel de construção">
  <title>SEELE — painel de construção</title>
  <rect width="128" height="128" fill="#050403"/>
  <g transform="translate(16 16)">
    <g stroke="#7A7061" stroke-width="0.25" opacity="0.35">
    <path d="M0 0V96"/>
    <path d="M0 0H96"/>
    <path d="M4 0V96"/>
    <path d="M0 4H96"/>
    <path d="M8 0V96"/>
    <path d="M0 8H96"/>
    <path d="M12 0V96"/>
    <path d="M0 12H96"/>
    <path d="M16 0V96"/>
    <path d="M0 16H96"/>
    <path d="M20 0V96"/>
    <path d="M0 20H96"/>
    <path d="M24 0V96"/>
    <path d="M0 24H96"/>
