    <path d="M0 40H96"/>
    <path d="M44 0V96"/>
    <path d="M0 44H96"/>
    <path d="M48 0V96"/>
    <path d="M0 48H96"/>
    <path d="M52 0V96"/>
    <path d="M0 52H96"/>
    <path d="M56 0V96"/>
    <path d="M0 56H96"/>
    <path d="M60 0V96"/>
    <path d="M0 60H96"/>
    <path d="M64 0V96"/>
    <path d="M0 64H96"/>
    <path d="M68 0V96"/>
    <path d="M0 68H96"/>
    <path d="M72 0V96"/>
    <path d="M0 72H96"/>
    <path d="M76 0V96"/>
    <path d="M0 76H96"/>
    <path d="M80 0V96"/>
    <path d="M0 80H96"/>
    <path d="M84 0V96"/>
    <path d="M0 84H96"/>
    <path d="M88 0V96"/>
    <path d="M0 88H96"/>
    <path d="M92 0V96"/>
