    <path d="M96 0V96"/>
    <path d="M0 96H96"/>
    </g>
    <rect x="12" y="12" width="72" height="72" fill="none" stroke="#7A7061"
          stroke-width="0.5" stroke-dasharray="3 3"/>

    <!-- a diagonal de construção: os dois nós ficam nos cantos opostos do
         mesmo eixo de 45°, e é esse eixo que a marca nunca gira. -->
    <path d="M0 0L96 96" stroke="#7A7061" stroke-width="0.5" stroke-dasharray="2 4"/>

    <path d="M34 34L62 62" stroke="#EAE3CF" stroke-width="4"/>
    <rect x="12" y="12" width="24" height="24" fill="#F2521F"/>
    <rect x="62" y="62" width="20" height="20" fill="none" stroke="#F2521F" stroke-width="4"/>
  </g>
</svg>
