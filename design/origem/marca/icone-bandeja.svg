<!-- SEELE · bandeja do sistema, com enlace. Monocromático: herda a cor do tema
     por `currentColor`, que é o que a bandeja de cada sistema pede.
     É o desenho da faixa miúda (`design/marca/muda.svg`), porque uma bandeja
     nunca passa de 22 px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="SEELE">
  <title>SEELE · bandeja do sistema — com enlace</title>
  <path d="M33 33L63 63" stroke="currentColor" stroke-width="6"></path>
  <rect x="12" y="12" width="24" height="24" fill="currentColor"></rect>
  <rect x="63" y="63" width="18" height="18" fill="none" stroke="currentColor" stroke-width="6"></rect>
</svg>
