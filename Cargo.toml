[workspace]
resolver = "2"
members = [
    "crates/seele-proto",
    "crates/seele-encontro",
    "crates/seele-voz",
    "crates/seele-audio",
    "crates/seele-video",
    "crates/seele-sessao",
    "crates/seele-enlace",
    "crates/seele-core",
    "crates/seele-server",
    "crates/seele-ffi",
    "crates/seele-lancador",
    "crates/seele-motor",
    "crates/seele-web",
    "crates/seele-motor-web",
    "apps/seele-app",
    "apps/seele-instalador",
    "crates/seele-conformance",
    "xtask",
]

# Every crate specs/01-arquitetura.md names now exists. Each arrived with the
# first code that belonged to it, never before (risk R10): `seele-server` with
# M2, `seele-ffi` with M5. `seele-tui` existiu de M4 até o ADR 0039.

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
publish = false

# Rules from specs/10-convencoes.md and specs/08-seguranca.md, applied in one place.
# Crates needing an exception (seele-ffi, audio bindings) declare their own `[lints]`
# block instead of inheriting this one — `forbid` cannot be relaxed by `allow`, which
# is precisely the property we want.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
# specs/10-convencoes.md: "no unwrap() or expect() outside tests and proven
# invariants". Test-only relaxation is done per crate with cfg_attr.
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
# specs/08-seguranca.md: untrusted network input. Panicking indexation is the classic
# way to turn a malformed packet into a denial of service.
indexing_slicing = "warn"

# Versions live here, never in the member crates, so they cannot drift apart.
[workspace.dependencies]
# Opus binding. See ADR 0008 for why this one and not `audiopus`.
shiguredo_opus = "2026.2.0"
# `IPV6_V6ONLY`, which `std` cannot say. Two crates need it for the same reason
# and against the same defect — a socket whose family the system decides on its
# own — so the version lives here, per the note above, rather than being
# declared twice and drifting.
socket2 = "0.6.5"

# A cripto e o SCTP do transporte da 0.17 otimizados também no perfil de
# desenvolvimento (pedido do E, 24/10). Sem otimização a cripto deixa a tarefa
# da `Ponta` presa à CPU: medido em debug, 32 MiB num canal levavam 9–27 s,
# contra 0,5 s em release, e a voz no teste do R4 dependia da carga da máquina.
# Só estes pacotes: o código do produto continua em debug, com os
# `debug_assertions` e os símbolos de sempre.
#
# O SRTP, o SHA e o HMAC do STUN continuam em RustCrypto (`aes` … `sha2`). O
# DTLS passou ao AWS-LC em 25/10 (RUSTSEC-2026-0387, ADR 0063), e saíram daqui
# o `p256`, o `primeorder`, o `elliptic-curve`, o `crypto-bigint` e o `ecdsa`,
# que não estão mais na árvore. Entra o `aws-lc-sys`: o `cc` lê o `OPT_LEVEL`
# do perfil do pacote, então é isto que compila o C do AWS-LC otimizado em
# debug.
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.aws-lc-sys]
opt-level = 3
[profile.dev.package.aws-lc-rs]
opt-level = 3
[profile.dev.package.dimpl]
opt-level = 3
[profile.dev.package.sctp-proto]
opt-level = 3
[profile.dev.package.str0m]
opt-level = 3
